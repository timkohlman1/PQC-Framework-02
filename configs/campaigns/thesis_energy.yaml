# Thesis pilot design: ten independent reset attempts per condition.
# Set final sample counts from pilot variability; these are not completed measurements.
schema_version: 1
profile_type: campaign
id: thesis_energy
target: stm32l4r5_st67
gateway: pqc_gateway1
services:
  experiment_broker: experiment_gateway1
  reporting_broker: reporting_gateway1
workload: ready_metrics_2
fixed:
  secure_boot: integrity_sha256
  firmware_mode: single_bank
  standby_signing_keys: 0
  boot_stack_profiling: false
  boot_uart_diagnostics: false
  network_condition: baseline
execution:
  energy_monitoring: auto
  repetitions: 10
  reset_between_runs: hardware_reset
  build: once_per_firmware_identity
  flash: once_per_firmware_identity
  experiment_broker: reuse_if_compatible
  reporting_broker: always_available
  condition: retain_within_condition
  evidence: per_run
analysis_baselines:
  tls_auth: ecdsa-p256
matrix:
  tls_kex:
  - secp256r1
  - SecP256r1MLKEM768
  tls_auth:
  - ecdsa-p256
  - mldsa65
  auth_mode:
  - server
instruments:
  energy: esp32_ina228

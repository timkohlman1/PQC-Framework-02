per_listener_settings true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

listener 8883 0.0.0.0
protocol mqtt
allow_anonymous true
cafile /tmp/mosquitto-certs/ca.crt
certfile /tmp/mosquitto-certs/server.crt
keyfile /tmp/mosquitto-certs/server.key
require_certificate false
use_identity_as_username false
tls_version tlsv1.3
user nobody
acl_file /tmp/mosquitto-aclfile

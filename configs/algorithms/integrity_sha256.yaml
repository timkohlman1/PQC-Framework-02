id: integrity_sha256
target: stm32l4r5_wolfboot
description: Default wolfBoot integrity-only profile with SHA-256 image hashing and no signature or signing-key validation.
profiles:
  build:
    id: wolfboot_stm32l4_integrity
    description: Build wolfBoot with SIGN=NONE and SHA-256 image integrity verification.
    status: configured_build_only_not_hardware_validated
    signature_algorithm: integrity_sha256
    boot_profile: wolfboot_integrity
    build:
      config_template: configs/wolfboot/stm32l4r5_integrity.config
    notes: This baseline intentionally provides integrity checking only. It does not authenticate the image signer and must not be described as cryptographic authenticity.
  signing:
    id: wolfboot_integrity_app
    description: Add a wolfBoot SHA-256 manifest header without a signature or private key.
    status: configured_integrity_packaging_only_not_hardware_validated
    boot_profile: wolfboot_integrity
    input_elf: build/Release/stm32_basic_hal1.elf
    input_image: build/Release/stm32_basic_hal1_integrity.bin
    signed_image: build/Release/stm32_basic_hal1_integrity_v1_signed.bin
    signature_algorithm: integrity_sha256
    image_version: 1
    image_header_size_bytes: 12288
    require_input_build_provenance: true
    build_preset: Release
    binary_conversion:
      enabled: true
      command: arm-none-eabi-objcopy
      args: -O binary {input_elf} {input_image}
    keygen:
      enabled: false
    sign:
      command: tools/keytools/sign
      working_dir: tools/wolfboot
      environment:
        IMAGE_HEADER_SIZE: "12288"
      args: --no-sign --sha256 {input_image} {image_version}
    retained_signed_image: application_integrity.bin
    notes: The wolfBoot sign tool is used only to create the manifest and SHA-256 integrity digest. No KEY.DER argument is supplied.
  experiment:
    id: wolfboot_integrity_uart
    description: Run the selected experiment through wolfBoot using SHA-256 integrity verification without signature authentication.
    boot: wolfboot_integrity
    boot_crypto: integrity_sha256
    firmware:
      mode: wolfboot_integrity
      artifact: build/Release/stm32_basic_hal1_integrity_v1_signed.bin
    secure_boot_flash:
      signature_algorithm: integrity_sha256
      wolfboot_offset: 0x08000000
      unsigned_application_artifact: build/Release/stm32_basic_hal1_integrity.bin
      signed_application_artifact: build/Release/stm32_basic_hal1_integrity_v1_signed.bin
      signed_application_offset: 0x08020000
  boot:
    id: wolfboot_integrity
    mode: wolfboot_integrity
    description: Runnable wolfBoot integrity-only baseline using SHA-256 image verification without signer authentication.
    runnable: true
    status: configured_integrity_only_not_hardware_validated
    intended_signature_algorithm: integrity_sha256
    secure_boot_layout:
      wolfboot_base: 0x08000000
      wolfboot_size: 0x00020000
      primary_slot_base: 0x08020000
      primary_slot_size: 0x000E0000
      primary_slot_entry: 0x08023000
      image_header_size: 0x00003000
      update_slot_base: 0x08100000
      update_slot_size: 0x000E0000
      swap_metadata_base: 0x081E0000
      swap_metadata_size: 0x00020000
    relocated_application_build:
      cmake_configure_preset: Release
      cmake_build_preset: Release
      linker_script: STM32L4R5XX_FLASH_RELOCATED.ld
      vector_table_offset: 0x00023000
      linked_application_start: 0x08023000

# Preliminary secure-boot capture qualification: 5 profiles x 2 resets = 10 runs.
# Resolve: ./scripts/dev.sh python scripts/resolve_campaign.py secure_boot_pilot_smoke.yaml
# Run: ./scripts/dev.sh campaign-gateway secure_boot_pilot_smoke
# Preparation runs are separate from the counted runtime repetitions.
# Inspect finalised capture and raw secure-boot records before larger campaigns.
# This profile requests capture; it does not establish hardware/metric validity.
schema_version: 1
profile_type: campaign
id: secure_boot_pilot_smoke
target: stm32l4r5_st67
gateway: pqc_gateway1
services:
  experiment_broker: experiment_gateway1
  reporting_broker: reporting_gateway1
workload: mqtt_validation
fixed:
  mqtt_transport: plaintext
  network_condition: baseline
  firmware_mode: dual_bank_no_ota
  standby_signing_keys: 0
  boot_stack_profiling: false
  boot_uart_diagnostics: false
# Energy is intentionally unselected: its current interval starts after wolfBoot.
matrix:
  secure_boot:
    - integrity_sha256
    - ecdsa_p256
    - ed25519
    - rsa2048
    - mldsa44
execution:
  repetitions: 2
  reset_between_runs: hardware_reset
  build: once_per_firmware_identity
  flash: once_per_firmware_identity
  experiment_broker: reuse_if_compatible
  reporting_broker: always_available
  condition: retain_within_condition
  evidence: per_run

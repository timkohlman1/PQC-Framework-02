services:
  mqtt-classical:
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    profiles: ["classical"]
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        cp /mosquitto/config/aclfile.source /tmp/mosquitto-aclfile
        rm -rf /tmp/mosquitto-certs
        mkdir -p /tmp/mosquitto-certs
        cp /mosquitto/config/certs/ca.crt /tmp/mosquitto-certs/ca.crt
        cp /mosquitto/config/certs/ca-chain.crt /tmp/mosquitto-certs/ca-chain.crt
        cp /mosquitto/config/certs/server.crt /tmp/mosquitto-certs/server.crt
        cp /mosquitto/config/certs/server.key /tmp/mosquitto-certs/server.key
        if id mosquitto >/dev/null 2>&1; then
          runtime_user="$(id -u mosquitto)"
          runtime_group="$(id -g mosquitto)"
        elif id nobody >/dev/null 2>&1; then
          runtime_user="$(id -u nobody)"
          runtime_group="$(id -g nobody)"
        else
          runtime_user=0
          runtime_group=0
        fi
        chown "$$runtime_user:$$runtime_group" /tmp/mosquitto-aclfile /tmp/mosquitto-certs/*
        chmod 0640 /tmp/mosquitto-aclfile /tmp/mosquitto-certs/server.key
        chmod 0644 /tmp/mosquitto-certs/ca.crt /tmp/mosquitto-certs/ca-chain.crt /tmp/mosquitto-certs/server.crt
        mkdir -p /mosquitto/keylog
        rm -f /mosquitto/keylog/mqtt-broker-tls-keylog.log
        chown "$$runtime_user:$$runtime_group" /mosquitto/keylog
        chmod 0700 /mosquitto/keylog
        umask 077
        exec mosquitto --tls-keylog /mosquitto/keylog/mqtt-broker-tls-keylog.log -c /mosquitto/config/mosquitto.conf
    ports:
      - "${MQTT_PLAINTEXT_PORT:-1883}:1883"
      - "${MQTT_CLASSICAL_TLS_PORT:-8883}:8883"
    volumes:
      - ./config/classical/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./config/classical/aclfile:/mosquitto/config/aclfile.source:ro
      - ../../secrets/mqtt/${MQTT_CERTIFICATE_PROFILE:-stepca-classical}:/mosquitto/config/certs:ro
      - ./data/classical:/mosquitto/data
      - ./log/classical:/mosquitto/log
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/version' -C 1 -W 5 >/dev/null 2>&1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mqtt-classical-server-auth:
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    profiles: ["classical-server-auth"]
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        rm -rf /tmp/mosquitto-certs
        mkdir -p /tmp/mosquitto-certs
        cp /mosquitto/config/certs/ca.crt /tmp/mosquitto-certs/ca.crt
        cp /mosquitto/config/certs/server.crt /tmp/mosquitto-certs/server.crt
        cp /mosquitto/config/certs/server.key /tmp/mosquitto-certs/server.key
        if id mosquitto >/dev/null 2>&1; then
          runtime_user="$(id -u mosquitto)"
          runtime_group="$(id -g mosquitto)"
        elif id nobody >/dev/null 2>&1; then
          runtime_user="$(id -u nobody)"
          runtime_group="$(id -g nobody)"
        else
          runtime_user=0
          runtime_group=0
        fi
        chown "$$runtime_user:$$runtime_group" /tmp/mosquitto-certs/*
        chmod 0640 /tmp/mosquitto-certs/server.key
        chmod 0644 /tmp/mosquitto-certs/ca.crt /tmp/mosquitto-certs/server.crt
        mkdir -p /mosquitto/keylog
        rm -f /mosquitto/keylog/mqtt-broker-tls-keylog.log
        chown "$$runtime_user:$$runtime_group" /mosquitto/keylog
        chmod 0700 /mosquitto/keylog
        umask 077
        exec mosquitto --tls-keylog /mosquitto/keylog/mqtt-broker-tls-keylog.log -c /mosquitto/config/mosquitto.conf
    ports:
      - "${MQTT_CLASSICAL_SERVER_AUTH_TLS_PORT:-8883}:8883"
    volumes:
      - ./config/classical-server-auth/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ../../secrets/mqtt/${MQTT_CERTIFICATE_PROFILE:-stepca-classical}:/mosquitto/config/certs:ro
      - ./data/classical-server-auth:/mosquitto/data
      - ./log/classical-server-auth:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "test -r /tmp/mosquitto-certs/ca.crt && test -r /tmp/mosquitto-certs/server.crt && test -r /tmp/mosquitto-certs/server.key"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  mqtt-oqs:
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    profiles: ["oqs"]
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        cp /mosquitto/config/aclfile.source /tmp/mosquitto-aclfile
        rm -rf /tmp/mosquitto-certs
        mkdir -p /tmp/mosquitto-certs
        cp /mosquitto/config/certs/ca.crt /tmp/mosquitto-certs/ca.crt
        cp /mosquitto/config/certs/server.crt /tmp/mosquitto-certs/server.crt
        cp /mosquitto/config/certs/server.key /tmp/mosquitto-certs/server.key
        if id mosquitto >/dev/null 2>&1; then
          runtime_user="$(id -u mosquitto)"
          runtime_group="$(id -g mosquitto)"
        elif id nobody >/dev/null 2>&1; then
          runtime_user="$(id -u nobody)"
          runtime_group="$(id -g nobody)"
        else
          runtime_user=0
          runtime_group=0
        fi
        chown "$$runtime_user:$$runtime_group" /tmp/mosquitto-aclfile /tmp/mosquitto-certs/*
        chmod 0640 /tmp/mosquitto-aclfile /tmp/mosquitto-certs/server.key
        chmod 0644 /tmp/mosquitto-certs/ca.crt /tmp/mosquitto-certs/server.crt
        mkdir -p /mosquitto/keylog
        rm -f /mosquitto/keylog/mqtt-broker-tls-keylog.log
        chown "$$runtime_user:$$runtime_group" /mosquitto/keylog
        chmod 0700 /mosquitto/keylog
        umask 077
        exec mosquitto --tls-keylog /mosquitto/keylog/mqtt-broker-tls-keylog.log -c /mosquitto/config/mosquitto.conf
    ports:
      - "${MQTT_OQS_TLS_PORT:-8884}:8883"
    environment:
      OPENSSL_CONF: "/mosquitto/config/openssl.cnf"
    volumes:
      - ./config/oqs/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./config/oqs/openssl.cnf:/mosquitto/config/openssl.cnf:ro
      - ./config/oqs/aclfile:/mosquitto/config/aclfile.source:ro
      - ../../secrets/mqtt/${MQTT_CERTIFICATE_PROFILE:-stepca-classical}:/mosquitto/config/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 8883 --cafile /tmp/mosquitto-certs/ca.crt --tls-version tlsv1.3 -t pqc/framework/health -m ready >/dev/null 2>&1"]
      interval: 30s
      timeout: 12s
      retries: 3
      start_period: 10s

  mqtt-oqs-mtls:
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    profiles: ["oqs-mtls"]
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        cp /mosquitto/config/aclfile.source /tmp/mosquitto-aclfile
        rm -rf /tmp/mosquitto-certs
        mkdir -p /tmp/mosquitto-certs
        cp /mosquitto/config/certs/ca.crt /tmp/mosquitto-certs/ca.crt
        cp /mosquitto/config/certs/server.crt /tmp/mosquitto-certs/server.crt
        cp /mosquitto/config/certs/server.key /tmp/mosquitto-certs/server.key
        if id mosquitto >/dev/null 2>&1; then
          runtime_user="$(id -u mosquitto)"
          runtime_group="$(id -g mosquitto)"
        elif id nobody >/dev/null 2>&1; then
          runtime_user="$(id -u nobody)"
          runtime_group="$(id -g nobody)"
        else
          runtime_user=0
          runtime_group=0
        fi
        chown "$$runtime_user:$$runtime_group" /tmp/mosquitto-aclfile /tmp/mosquitto-certs/*
        chmod 0640 /tmp/mosquitto-aclfile /tmp/mosquitto-certs/server.key
        chmod 0644 /tmp/mosquitto-certs/ca.crt /tmp/mosquitto-certs/server.crt
        mkdir -p /mosquitto/keylog
        rm -f /mosquitto/keylog/mqtt-broker-tls-keylog.log
        chown "$$runtime_user:$$runtime_group" /mosquitto/keylog
        chmod 0700 /mosquitto/keylog
        umask 077
        exec mosquitto --tls-keylog /mosquitto/keylog/mqtt-broker-tls-keylog.log -c /mosquitto/config/mosquitto.conf
    ports:
      - "${MQTT_OQS_MTLS_PORT:-8885}:8883"
    environment:
      OPENSSL_CONF: "/mosquitto/config/openssl.cnf"
    volumes:
      - ./config/oqs-mtls/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./config/oqs-mtls/openssl.cnf:/mosquitto/config/openssl.cnf:ro
      - ./config/oqs-mtls/aclfile:/mosquitto/config/aclfile.source:ro
      - ../../secrets/mqtt/${MQTT_CERTIFICATE_PROFILE:-stepca-classical}:/mosquitto/config/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 8883 --cafile /tmp/mosquitto-certs/ca.crt --cert /mosquitto/config/certs/client.crt --key /mosquitto/config/certs/client.key --tls-version tlsv1.3 -t pqc/framework/health -m ready >/dev/null 2>&1"]
      interval: 30s
      timeout: 12s
      retries: 3
      start_period: 10s

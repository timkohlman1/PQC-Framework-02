listener 1886 0.0.0.0
allow_anonymous true
acl_file /mosquitto/config/aclfile
persistence false
# The reporting plane carries retained OTA chunks. The maximum supported
# dual-bank candidate is ~5,464 retained messages at the framework's
# 192-byte chunk size, so keep an explicit bounded queue above that burst.
max_queued_messages 8192
log_dest stdout
log_type all

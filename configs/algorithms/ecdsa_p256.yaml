id: ecdsa_p256
target: stm32l4r5_wolfboot
profiles:
  build:
    id: wolfboot_stm32l4_ecdsa_p256
    description: Build profile for wolfBoot targeting the planned STM32L4R5 ECDSA-P256 secure-boot configuration.
    status: configured_phase_10f1_project_local_target_adaptation_build_only_not_boot_validated
    signature_algorithm: ecdsa_p256
    classical_benchmark_profile:
      model: configs/benchmarks/classical_signing_profiles.yaml
      profile_id: ecc256_reference
      algorithm: ECC256
      wolfboot_sign: ECC256
      curve: P-256
      key_size_bits: 256
      signature_size_bytes: 64
      reference_path: true
      minimum_scope_member: true
    boot_profile: wolfboot_ecdsa_p256
    build:
      config_template: configs/wolfboot/stm32l4r5_ecdsa_p256.config
      signing_key: secrets/wolfboot/tuples/ecdsa_p256-development/private_key.der
      signing_tuple:
        tuple_id: ecdsa_p256-development
        directory: secrets/wolfboot/tuples/ecdsa_p256-development
        public_key: public_key.der
        public_key_export_format: wolfboot_raw_ecc_xy
        public_key_size: 64
    notes: This profile is build-only and is the ECC256 reference wolfBoot build profile for the Phase 11.5a minimum classical comparison scope. The framework copies the tracked project-local wolfBoot config template to tools/wolfboot/.config, applies temporary MinGW host-keytools stdio, STM32L4 HAL PWR-include compatibility, and Phase 10k boot-timing instrumentation patches when requested, then invokes make inside the local wolfBoot submodule with WOLFBOOT_ROOT=. wolfboot.elf so wolfBoot host-tool paths remain relative to the submodule root on Windows/MSYS and the Phase 10f.1 build stops after the bootloader ELF target instead of also attempting wolfBoot test-application image generation. It coordinates the local signing key used by wolfBoot keystore generation with the framework signing profile, but does not copy private key material into results, sign application images, flash hardware, capture UART, or prove secure-boot runtime behaviour. The boot-timing patch is build-time instrumentation only; timing and runtime stack evidence are confirmed only when a subsequent secure-boot UART run contains explicit wolfBoot verification timing and max-stack markers and the manifest records verification_time_ms, verification_cycles, and max_stack_used_bytes as numbers.
  signing:
    id: wolfboot_ecdsa_p256_app
    description: Sign the relocated STM32 HAL application image for the planned wolfBoot ECDSA-P256 primary slot.
    require_input_build_provenance: true
    status: configured_phase_10g_signing_only_not_flashing_or_boot_validated
    boot_profile: wolfboot_ecdsa_p256
    input_image: build/RelocatedDebug/stm32_basic_hal1.bin
    signed_image: build/RelocatedDebug/stm32_basic_hal1_v1_signed.bin
    signature_algorithm: ecdsa_p256
    signature_size_bytes: 64
    classical_benchmark_profile:
      model: configs/benchmarks/classical_signing_profiles.yaml
      profile_id: ecc256_reference
      algorithm: ECC256
      wolfboot_sign: ECC256
      curve: P-256
      key_size_bits: 256
      signature_size_bytes: 64
      reference_path: true
      minimum_scope_member: true
    private_key: secrets/wolfboot/tuples/ecdsa_p256-development/private_key.der
    keygen:
      args: --ecc256 -g {private_key}
    sign:
      args: --ecc256 {input_image} {private_key} {image_version}
    signing_tuple:
      tuple_id: ecdsa_p256-development
      directory: secrets/wolfboot/tuples/ecdsa_p256-development
      public_key: public_key.der
    notes: This profile is signing-only and is the ECC256 reference signing profile for the Phase 11.5a minimum classical comparison scope. The private key path is intentionally under secrets/ and must remain local. The matching wolfBoot build profile initializes the complete persistent signing tuple when it is entirely absent; application signing never generates a private key by itself, converts the relocated ELF to the configured BIN image when needed, runs wolfBoot keytools from the tools/wolfboot working directory, sends explicit keygen overwrite confirmation only when configured, signs the BIN image, records signing metadata under results/signing, and retains only the signed image artifact. It does not copy private keys into results, flash hardware, capture UART, or prove secure-boot runtime behaviour.
  experiment:
    id: wolfboot_ecdsa_p256_uart
    description: Flash wolfBoot and the signed ECDSA-P256 application image, then capture UART evidence.
    boot: wolfboot_ecdsa_p256
    boot_crypto: ecdsa_p256
    firmware:
      mode: wolfboot_ecdsa_p256
      artifact: build/RelocatedDebug/stm32_basic_hal1_v1_signed.bin
    secure_boot_benchmark_profile:
      profile_id: ecc256_reference
      algorithm: ECC256
      wolfboot_sign: ECC256
      signature_algorithm: ecdsa_p256
      curve: P-256
      key_size_bits: 256
      signature_size_bytes: 64
      status: reference_existing_phase_10_11_profile
      signing_profile: configs/signing/wolfboot_ecdsa_p256_app.yaml
      wolfboot_build_profile: configs/builds/wolfboot_stm32l4_ecdsa_p256.yaml
      experiment_profile: configs/experiments/wolfboot_ecdsa_p256_uart.yaml
      boot_profile: configs/boot/wolfboot_ecdsa_p256.yaml
      minimum_scope_status: defined_phase_11_5a_minimum_classical_scope
      ed25519_status: planned_phase_11_5b_not_implemented
      rsa2048_status: planned_phase_11_5c_not_implemented
      scope_limitations: Phase 11.5a defines the profile model only; ED25519 and RSA2048 runnable profiles are added in later sub-phases.
    secure_boot_flash:
      evidence_phase: phase_11_5a_classical_profile_model
      signature_algorithm: ecdsa_p256
      signature_size_bytes: 64
      wolfboot_offset: 0x08000000
      unsigned_application_artifact: build/RelocatedDebug/stm32_basic_hal1.bin
      signed_application_artifact: build/RelocatedDebug/stm32_basic_hal1_v1_signed.bin
      signed_application_offset: 0x08020000
      signing_private_key: secrets/wolfboot/ecdsa_p256_private_key.der
      boot_timing_source: framework_derived_from_uart_cycles_and_reported_hclk
      notes: Phase 10i requires the secure-boot application UART marker in addition to the normal boot and tick markers. Phase 10j can be run with --negative-corrupt-application to flash a result-local corrupted copy of the signed image without modifying the original signed image or private signing key. Phase 10k records verification_time_ms only when an explicit wolfBoot verification-time UART line is captured; otherwise the manifest records null timing with the unavailable source and limitations. Phase 10l records consolidated secure_boot_evidence linking flash, signing, UART, timing, result, and negative-test evidence. Phase 11.3 records static wolfBoot section/resource metrics and signed-image overhead where artifacts are available. Phase 11.4 records maximum stack high-water evidence only when the instrumented secure-boot firmware emits an explicit UART stack marker; heap metrics remain unavailable unless explicit firmware-side heap evidence is emitted. Phase 11.5a records the ECC256 reference profile metadata and reserves ED25519 and RSA2048 in the minimum comparison scope without adding those runnable profiles yet.
  boot:
    id: wolfboot_ecdsa_p256
    mode: wolfboot_ecdsa_p256
    description: Planned wolfBoot ECDSA-P256 secure-boot profile. Generic direct-flash execution remains blocked; Phase 10h provides an explicit two-artifact flash workflow.
    status: phase_10l_secure_boot_manifest_and_documentation_consolidated
    implementation_state: positive_negative_timing_and_consolidated_manifest_evidence_defined
    intended_signature_algorithm: ecdsa_p256
    classical_benchmark_profile:
      model: configs/benchmarks/classical_signing_profiles.yaml
      profile_id: ecc256_reference
      algorithm: ECC256
      minimum_scope_member: true
      reference_path: true
    flash_layout_status: defined_phase_10d_used_by_phase_10h_flash_workflow
    secure_boot_layout:
      status: planned_layout_used_by_phase_10h_flash_workflow
      internal_flash_base: 0x08000000
      internal_flash_size: 0x00200000
      internal_flash_end: 0x081FFFFF
      wolfboot_base: 0x08000000
      wolfboot_size: 0x00020000
      primary_slot_base: 0x08020000
      primary_slot_size: 0x000E0000
      primary_slot_entry: 0x08022000
      image_header_size: 0x00002000
      update_slot_base: 0x08100000
      update_slot_size: 0x000E0000
      swap_metadata_base: 0x081E0000
      swap_metadata_size: 0x00020000
      sector_size_assumption: 0x00004000
      physical_flash_page_assumption: 0x00001000
      wolfboot_partition_boot_address: 0x08020000
      wolfboot_partition_size: 0x000E0000
      wolfboot_partition_update_address: 0x08100000
      wolfboot_partition_swap_address: 0x081E0000
    relocated_application_build:
      status: defined_phase_10e_build_only_not_boot_validated
      cmake_configure_preset: RelocatedDebug
      cmake_build_preset: RelocatedDebug
      linker_script: STM32L4R5XX_FLASH_RELOCATED.ld
      vector_table_offset: 0x00022000
      linked_application_start: 0x08022000
      runtime_boot_validated: false
    target_support_assessment:
      status: assessed_phase_10c
      decision_record: docs/decisions/0002_wolfboot_stm32l4_target_support_assessment.md
      upstream_closest_target: stm32l4
      project_target_strategy: project_local_stm32l4r5_target_configuration_or_adaptation
      runnable: false
      notes: Existing upstream STM32L4 wolfBoot support is the closest starting point, but STM32L4R5 / NUCLEO-L4R5ZI-P requires a project-local flash layout and target configuration before wolfBoot build, signing, flashing, or UART evidence can be claimed.
    wolfboot_build_profile:
      status: defined_phase_10f1_project_local_target_adaptation_build_only_not_boot_validated
      profile: configs/builds/wolfboot_stm32l4_ecdsa_p256.yaml
      config_template: configs/wolfboot/stm32l4r5_ecdsa_p256.config
      command: python scripts/experiment.py build-wolfboot --profile configs/builds/wolfboot_stm32l4_ecdsa_p256.yaml
    application_signing_profile:
      status: defined_phase_10g_signing_only_not_flashing_or_boot_validated
      profile: configs/signing/wolfboot_ecdsa_p256_app.yaml
      input_image: build/RelocatedDebug/stm32_basic_hal1.bin
      signed_image: build/RelocatedDebug/stm32_basic_hal1_v1_signed.bin
      private_key: secrets/wolfboot/ecdsa_p256_private_key.der
      command: python scripts/experiment.py sign-application --profile configs/signing/wolfboot_ecdsa_p256_app.yaml
    secure_boot_flash_profile:
      status: defined_phase_10l_consolidated_manifest_evidence
      experiment: configs/experiments/wolfboot_ecdsa_p256_uart.yaml
      command: python scripts/experiment.py flash-secure-boot --experiment configs/experiments/wolfboot_ecdsa_p256_uart.yaml
      wolfboot_offset: 0x08000000
      signed_application_artifact: build/RelocatedDebug/stm32_basic_hal1_v1_signed.bin
      signed_application_offset: 0x08020000
      positive_boot_evidence_status: defined_phase_10i
      negative_corrupted_application_test_status: defined_phase_10j
      boot_timing_status: defined_phase_10k
      manifest_consolidation_status: defined_phase_10l
    notes: Placeholder only. The HAL relocated build profile, wolfBoot build-profile evidence capture, and project-local STM32L4R5 wolfBoot build adaptation exist for local build verification. A local-only application signing workflow exists and can convert the relocated ELF to a BIN before signing. Phase 10i defines a distinct secure-boot application UART marker for positive boot evidence, Phase 10j defines a corrupted-application negative test, Phase 10k records explicit verification timing evidence, and Phase 10l consolidates secure-boot manifest evidence. Hardware success must still only be claimed from user-provided flash and UART logs. Phase 11.5a records this ECC256 boot profile as the known-good reference member of the minimum classical comparison scope; ED25519 and RSA2048 remain reserved but non-runnable until later sub-phases.

id: ready_metrics_mqtt_tls_secp256r1_ecdsa-p256_server_auth_st67_e2e
description: Ready/connection-timing/periodic-memory application profile using secp256r1 with ECDSA P-256 server-authenticated MQTT over TLS 1.3 from STM32 through ST67W61M1 to the gateway broker.
board: board_a
host: gateway
boot: direct_flash
firmware:
  application: mqtt_ready_metrics
  mode: direct_flash
  artifact: build/Release/stm32_basic_hal1.elf
network:
  wifi:
    ssid: pqc
    psk: lukeisadog
  ipv4:
    mode: dhcp
  packet_capture:
    enabled: true
    interface: enp0s31f6
mqtt:
  schema_version: 1
  enabled: true
  evidence_class: stm32_st67_classical_tls_e2e
  transport_backend: st67w61m1_lwip_wolfssl
  broker_profile: classical-server-auth
  broker:
    host: pqc-gateway1.pqcnet
    port: 8883
    server_name: pqc-gateway1.pqcnet
    dns_required: true
  client_id: pqc-stm32-secp256r1-ecdsa-p256-tls-e2e
  topics:
    command: pqc/experiments/stm32/secp256r1/ecdsa-p256/server_auth/command
    response: pqc/experiments/stm32/secp256r1/ecdsa-p256/server_auth/response
  command_payload: run
  correlation_payload: pqc-stm32-secp256r1-ecdsa-p256-tls-e2e-ok
  reconnect_attempts: 1
  orchestration:
    host: 10.1.1.18
    completion_grace_seconds: 3
    hard_limit_seconds: 180
  tls:
    tls_version: tls1.3
    mode: classical_tls_server_auth
    certificate_profile: ecdsa-p256
    key_exchange_group: secp256r1
  result_schema:
    unavailable_metrics:
      latency_ms: No synchronized end-to-end latency metric is recorded.
      throughput_bytes_per_second: The bounded control exchange does not establish throughput.
uart:
  expected_boot_message: stm32-basic_hal1 boot v0.1.0
  expected_tick_message: tick

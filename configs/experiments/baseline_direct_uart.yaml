id: baseline_direct_uart
description: Baseline direct-flash UART smoke experiment for the known-good STM32 HAL application.
board: board_a
host: gateway
boot: direct_flash
firmware:
  mode: direct_flash
  artifact: build/Release/stm32_basic_hal1.elf
network:
  wifi:
    ssid: pqc
    psk: lukeisadog
  ipv4:
    mode: dhcp
  packet_capture:
    enabled: true
    interface: any
uart:
  expected_boot_message: stm32-basic_hal1 boot v0.1.0
  expected_tick_message: tick
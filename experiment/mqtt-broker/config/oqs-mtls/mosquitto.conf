per_listener_settings true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

listener 8883 0.0.0.0
protocol mqtt
allow_anonymous false
cafile /mosquitto/config/certs/ca-chain.crt
certfile /tmp/mosquitto-certs/server.crt
keyfile /tmp/mosquitto-certs/server.key
require_certificate true
use_identity_as_username true
tls_version tlsv1.3
user nobody
acl_file /tmp/mosquitto-aclfile

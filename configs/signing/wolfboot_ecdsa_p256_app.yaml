id: wolfboot_ecdsa_p256_app
description: Sign the relocated STM32 HAL application image for the planned wolfBoot ECDSA-P256 primary slot.
status: configured_phase_10g_signing_only_not_flashing_or_boot_validated
boot_profile: wolfboot_ecdsa_p256
relocated_build_preset: RelocatedDebug
input_elf: build/RelocatedDebug/stm32_basic_hal1.elf
input_image: build/RelocatedDebug/stm32_basic_hal1.bin
signed_image: build/RelocatedDebug/stm32_basic_hal1_v1_signed.bin
retained_signed_image: application_signed.bin
signature_algorithm: ecdsa_p256
signature_size_bytes: 64
image_version: 1
private_key: secrets/wolfboot/ecdsa_p256_private_key.der
key_policy: local_private_key_never_commit
binary_conversion:
  enabled: true
  command: arm-none-eabi-objcopy
  args: "-O binary {input_elf} {input_image}"
keygen:
  enabled: true
  working_dir: tools/wolfboot
  command: tools/keytools/keygen
  args: "--ecc256 -g {private_key}"
  stdin: "Yes\n"
sign:
  working_dir: tools/wolfboot
  command: tools/keytools/sign
  args: "--ecc256 {input_image} {private_key} {image_version}"
notes: This profile is signing-only. The private key path is intentionally under secrets/ and must remain local. The framework may generate the local key if it is absent, converts the relocated ELF to the configured BIN image when needed, runs wolfBoot keytools from the tools/wolfboot working directory, sends explicit keygen overwrite confirmation only when configured, signs the BIN image, records signing metadata under results/signing, and retains only the signed image artifact. It does not copy private keys into results, flash hardware, capture UART, or prove secure-boot runtime behaviour.

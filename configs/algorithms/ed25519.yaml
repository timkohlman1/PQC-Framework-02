id: ed25519
target: stm32l4r5_wolfboot
profiles:
  build:
    id: wolfboot_stm32l4_ed25519
    description: Build profile for wolfBoot targeting the planned STM32L4R5 ED25519 secure-boot benchmark configuration.
    status: configured_phase_11_5b_ed25519_build_only_not_boot_validated
    signature_algorithm: ed25519
    classical_benchmark_profile:
      model: configs/benchmarks/classical_signing_profiles.yaml
      profile_id: ed25519_benchmark
      algorithm: ED25519
      wolfboot_sign: ED25519
      signature_size_bytes: 64
      reference_path: false
      minimum_scope_member: true
    boot_profile: wolfboot_ed25519
    build:
      config_template: configs/wolfboot/stm32l4r5_ed25519.config
      signing_key: secrets/wolfboot/tuples/ed25519-development/private_key.der
      signing_tuple:
        tuple_id: ed25519-development
        directory: secrets/wolfboot/tuples/ed25519-development
    notes: This profile is build-only for the Phase 11.5b ED25519 benchmark profile. It uses the same STM32L4R5 layout, relocated application payload, boot-timing instrumentation, runtime stack high-water instrumentation, and result model as the ECC256 reference path. The framework coordinates the canonical local ED25519 signing key with the wolfBoot working-tree private key and records SHA-256 key fingerprints as non-secret consistency evidence. Private key material remains local and is not copied into results. A successful build does not prove signing, flashing, UART boot, or hardware success.
  signing:
    id: wolfboot_ed25519_app
    description: Sign the relocated STM32 HAL application image for the wolfBoot ED25519 primary slot benchmark profile.
    status: configured_phase_11_5b_signing_only_not_flashing_or_boot_validated
    boot_profile: wolfboot_ed25519
    input_image: build/RelocatedDebug/stm32_basic_hal1_ed25519.bin
    signed_image: build/RelocatedDebug/stm32_basic_hal1_ed25519_v1_signed.bin
    signature_algorithm: ed25519
    signature_size_bytes: 64
    classical_benchmark_profile:
      model: configs/benchmarks/classical_signing_profiles.yaml
      profile_id: ed25519_benchmark
      algorithm: ED25519
      wolfboot_sign: ED25519
      signature_size_bytes: 64
      reference_path: false
      minimum_scope_member: true
    private_key: secrets/wolfboot/tuples/ed25519-development/private_key.der
    keygen:
      args: --ed25519 -g {private_key}
    sign:
      args: --ed25519 {input_image} {private_key} {image_version}
    signing_tuple:
      tuple_id: ed25519-development
      directory: secrets/wolfboot/tuples/ed25519-development
    notes: This profile is signing-only for the Phase 11.5b ED25519 benchmark profile. The private key path is intentionally under secrets/ and must remain local. The matching wolfBoot build profile initializes the complete persistent signing tuple when it is entirely absent; application signing never generates a private key by itself, converts the relocated ELF to the configured BIN image when needed, signs the BIN image with the shared 8192-byte Phase 11 image-header reserve, records signing metadata under results/signing, and retains only the signed image artifact. It does not copy private keys into results, flash hardware, capture UART, or prove secure-boot runtime behaviour.
  experiment:
    id: wolfboot_ed25519_uart
    description: Flash wolfBoot and the signed ED25519 application image, then capture UART benchmark evidence.
    boot: wolfboot_ed25519
    boot_crypto: ed25519
    firmware:
      mode: wolfboot_ed25519
      artifact: build/RelocatedDebug/stm32_basic_hal1_ed25519_v1_signed.bin
    secure_boot_benchmark_profile:
      profile_id: ed25519_benchmark
      algorithm: ED25519
      wolfboot_sign: ED25519
      signature_algorithm: ed25519
      signature_size_bytes: 64
      status: configured_phase_11_5b_ed25519_profile
      signing_profile: configs/algorithms/ed25519.yaml
      wolfboot_build_profile: configs/algorithms/ed25519.yaml
      experiment_profile: configs/experiments/secure_boot_uart.yaml
      boot_profile: configs/algorithms/ed25519.yaml
      minimum_scope_status: phase_11_5b_ed25519_added_ecc256_reference_retained_rsa2048_reserved
      ed25519_status: configured_phase_11_5b_runnable_profile_not_hardware_validated
      rsa2048_status: planned_phase_11_5c_not_implemented
      scope_limitations: Phase 11.5b adds the ED25519 runnable profile. RSA2048 remains reserved until Phase 11.5c and cross-profile aggregation remains Phase 11.6 scope.
    secure_boot_flash:
      evidence_phase: phase_11_5b_ed25519_benchmark_profile
      signature_algorithm: ed25519
      signature_size_bytes: 64
      wolfboot_offset: 0x08000000
      unsigned_application_artifact: build/RelocatedDebug/stm32_basic_hal1_ed25519.bin
      signed_application_artifact: build/RelocatedDebug/stm32_basic_hal1_ed25519_v1_signed.bin
      signed_application_offset: 0x08020000
      signing_private_key: secrets/wolfboot/ed25519_private_key.der
      boot_timing_source: uart_explicit_verification_time_marker
      notes: Phase 11.5b uses the same relocated application payload and shared 8192-byte image-header reserve, UART markers, repeated-run model, static metrics model, runtime memory model, key-consistency evidence, and secure-boot benchmark manifest schema as the ECC256 reference profile. The secure-boot flash workflow refuses to flash when available ED25519 canonical and wolfBoot private-key fingerprints differ. Hardware success must only be claimed from user-provided flash and UART logs.
  boot:
    id: wolfboot_ed25519
    mode: wolfboot_ed25519
    description: Planned wolfBoot ED25519 secure-boot benchmark profile. Generic direct-flash execution remains blocked; Phase 10h secure-boot flashing uses explicit two-artifact profiles.
    status: configured_phase_11_5b_ed25519_profile_not_hardware_validated
    implementation_state: ed25519_build_sign_flash_profiles_defined_runtime_validation_requires_user_logs
    intended_signature_algorithm: ed25519
    classical_benchmark_profile:
      model: configs/benchmarks/classical_signing_profiles.yaml
      profile_id: ed25519_benchmark
      algorithm: ED25519
      minimum_scope_member: true
      reference_path: false
    flash_layout_status: defined_phase_10d_reused_by_phase_11_5b_ed25519_flash_workflow
    secure_boot_layout:
      status: planned_layout_used_by_secure_boot_flash_workflow
      internal_flash_base: 0x08000000
      internal_flash_size: 0x00200000
      internal_flash_end: 0x081FFFFF
      wolfboot_base: 0x08000000
      wolfboot_size: 0x00020000
      primary_slot_base: 0x08020000
      primary_slot_size: 0x000E0000
      primary_slot_entry: 0x08022000
      image_header_size: 0x00002000
      update_slot_base: 0x08100000
      update_slot_size: 0x000E0000
      swap_metadata_base: 0x081E0000
      swap_metadata_size: 0x00020000
      wolfboot_sector_size: 0x4000
      physical_flash_page_assumption: 0x1000
      runtime_boot_validated: false
    relocated_application:
      build_preset: RelocatedDebug
      linker_script: STM32L4R5XX_FLASH_RELOCATED.ld
      vector_offset: 0x00022000
      application_start: 0x08022000
      runtime_boot_validated: false
    wolfboot_build_profile:
      status: defined_phase_11_5b_build_only_not_boot_validated
      profile: configs/algorithms/ed25519.yaml
      config_template: configs/wolfboot/stm32l4r5_ed25519.config
      command: python scripts/experiment.py build-wolfboot --boot-algorithm ed25519
    application_signing_profile:
      status: defined_phase_11_5b_signing_only_not_flashing_or_boot_validated
      profile: configs/algorithms/ed25519.yaml
      input_image: build/RelocatedDebug/stm32_basic_hal1_ed25519.bin
      signed_image: build/RelocatedDebug/stm32_basic_hal1_ed25519_v1_signed.bin
      private_key: secrets/wolfboot/ed25519_private_key.der
      command: python scripts/experiment.py sign-application --boot-algorithm ed25519
    secure_boot_flash_profile:
      status: defined_phase_11_5b_flash_profile_not_hardware_validated
      experiment: configs/experiments/secure_boot_uart.yaml
      command: python scripts/experiment.py flash-secure-boot --experiment configs/experiments/secure_boot_uart.yaml --boot-algorithm ed25519
      wolfboot_offset: 0x08000000
      signed_application_artifact: build/RelocatedDebug/stm32_basic_hal1_ed25519_v1_signed.bin
      signed_application_offset: 0x08020000
      positive_boot_evidence_status: uses_existing_phase_10i_marker_model
      negative_corrupted_application_test_status: uses_existing_phase_10j_negative_test_model
      boot_timing_status: uses_existing_phase_10k_timing_model
      manifest_consolidation_status: uses_existing_phase_10l_and_phase_11_benchmark_schema
    notes: This ED25519 profile reuses the Phase 11 shared 8 KB image-header layout and the existing relocated application payload so algorithm comparisons remain comparable. It defines ED25519 build, signing, and secure-boot flash profile links, but hardware success and benchmark values require explicit user-provided logs.

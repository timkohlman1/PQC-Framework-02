name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-non-hardware:
    name: Containerised non-hardware validation
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PQC_DOCKER_IMAGE: pqc-framework-stm32-build:ci
      DOCKER_BUILDKIT: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Prepare CI environment file
        run: cp .env.sample .env

      - name: Validate Linux development wrapper syntax
        run: sh -n scripts/dev.sh

      - name: Build project container image
        run: ./scripts/dev.sh build-image

      - name: Show container tool versions
        run: |
          ./scripts/dev.sh run sh -lc '
            python --version &&
            cmake --version &&
            ninja --version &&
            arm-none-eabi-gcc --version | head -n 1 &&
            make --version | head -n 1
          '

      - name: Run unit tests
        run: ./scripts/dev.sh pytest tests/unit

      - name: Resolve baseline campaign
        run: ./scripts/dev.sh python scripts/resolve_campaign.py baseline.yaml

      - name: Validate baseline campaign resolution
        shell: bash
        run: |
          set -euo pipefail
          BASELINE_CASE=$(find .pqc-generated-state/campaigns/baseline/cases -name '*.yaml' | sort | head -n 1)
          test -n "$BASELINE_CASE"
          test -f "$BASELINE_CASE"

      - name: Provision ephemeral MQTT certificate profiles
        run: ./scripts/dev.sh python scripts/provision_certificates.py

      - name: Run baseline framework status
        shell: bash
        run: |
          set -euo pipefail
          BASELINE_CASE=$(find .pqc-generated-state/campaigns/baseline/cases -name '*.yaml' | sort | head -n 1)
          test -n "$BASELINE_CASE"
          ./scripts/dev.sh experiment status --experiment "$BASELINE_CASE"

      - name: Build direct-flash Debug firmware
        run: |
          ./scripts/dev.sh cmake --preset Debug
          ./scripts/dev.sh cmake --build --preset Debug

      - name: Build relocated firmware with framework provenance in container
        shell: bash
        run: |
          set -euo pipefail
          BASELINE_CASE=$(find .pqc-generated-state/campaigns/baseline/cases -name '*.yaml' | sort | head -n 1)
          ./scripts/dev.sh experiment build \
            --experiment "$BASELINE_CASE" \
            --configure-preset Release \
            --build-preset Release \
            --artifact build/Release/stm32_basic_hal1.elf

      - name: Build wolfBoot profile
        run: ./scripts/dev.sh experiment build-wolfboot --boot-algorithm ecdsa_p256

      - name: Sign relocated application in container
        run: ./scripts/dev.sh experiment sign-application --boot-algorithm ecdsa_p256

      - name: Run non-hardware integration tests
        run: ./scripts/dev.sh pytest tests/integration -m "integration and not docker_runtime" --pqc-require-local-build

      - name: Remove CI environment file
        if: always()
        run: rm -f .env

  mqtt-broker-docker-runtime:
    name: MQTT broker Docker runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - container-non-hardware

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml

      - name: Check Docker runtime availability
        run: |
          docker info
          docker compose version
          openssl version

      - name: Pull MQTT broker runtime image
        run: docker pull eclipse-mosquitto:2.0

      - name: Run MQTT broker Docker configuration/runtime tests
        run: |
          python -m pytest \
            tests/integration/test_mqtt_broker_docker_config_in.py \
            tests/integration/test_mqtt_broker_docker_runtime_in.py

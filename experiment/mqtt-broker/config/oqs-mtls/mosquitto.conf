persistence false
log_dest stdout
log_type all
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

listener 8883 0.0.0.0
protocol mqtt
listener_allow_anonymous false
cafile /mosquitto/config/certs/ca-chain.crt
certfile /tmp/mosquitto-certs/server.crt
keyfile /tmp/mosquitto-certs/server.key
require_certificate true
use_identity_as_username true
tls_version tlsv1.3
user nobody
acl_file /mosquitto/config/aclfile.source

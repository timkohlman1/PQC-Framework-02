id: classical_signing_profiles
description: Phase 11.5d classical secure-boot signing benchmark profile model with minimum and optional expanded classical comparison profiles.
schema_version: 1
model_phase: phase_11_5d_expanded_classical_profiles
benchmark_scope: secure_boot_classical_signing_algorithm
minimum_comparison_scope:
  ed25519:
    algorithm: ED25519
    wolfboot_sign: ED25519
    signature_size_bytes: 64
    status: configured_phase_11_5b_runnable_profile_not_hardware_validated
    runnable: true
    signature_algorithm: ed25519
  ecc256:
    algorithm: ECC256
    wolfboot_sign: ECC256
    signature_algorithm: ecdsa_p256
    curve: P-256
    key_size_bits: 256
    signature_size_bytes: 64
    status: reference_existing_phase_10_11_profile
    runnable: true
  rsa2048:
    algorithm: RSA2048
    wolfboot_sign: RSA2048
    signature_algorithm: rsa2048
    key_size_bits: 2048
    signature_size_bytes: 256
    status: configured_phase_11_5c_runnable_profile_not_hardware_validated
    runnable: true
profiles:
  ecc256_reference:
    id: ecc256_reference
    algorithm: ECC256
    wolfboot_sign: ECC256
    signature_algorithm: ecdsa_p256
    curve: P-256
    key_size_bits: 256
    signature_size_bytes: 64
    image_version: 1
    runnable: true
    status: reference_existing_phase_10_11_profile
    signing_profile: configs/signing/wolfboot_ecdsa_p256_app.yaml
    wolfboot_build_profile: configs/builds/wolfboot_stm32l4_ecdsa_p256.yaml
    experiment_profile: configs/experiments/wolfboot_ecdsa_p256_uart.yaml
    boot_profile: configs/boot/wolfboot_ecdsa_p256.yaml
    application_payload: same_relocated_hal_application_payload
    board: board_a
    cpu_hz: 80000000
    measurement_method: uart_explicit_wolfboot_mailbox_markers
    repeated_run_model: phase_11_2_repeat_count_samples
    static_metrics_model: phase_11_3_elf_and_artifact_metrics
    runtime_memory_model: phase_11_4_firmware_side_stack_high_water_marker
    assumptions: Existing ECC256 profile remains the known-good reference path for the minimum classical comparison scope.
  ed25519_benchmark:
    id: ed25519_benchmark
    algorithm: ED25519
    wolfboot_sign: ED25519
    signature_algorithm: ed25519
    signature_size_bytes: 64
    image_version: 1
    runnable: true
    status: configured_phase_11_5b_runnable_profile_not_hardware_validated
    signing_profile: configs/signing/wolfboot_ed25519_app.yaml
    wolfboot_build_profile: configs/builds/wolfboot_stm32l4_ed25519.yaml
    experiment_profile: configs/experiments/wolfboot_ed25519_uart.yaml
    boot_profile: configs/boot/wolfboot_ed25519.yaml
    application_payload: same_relocated_hal_application_payload
    board: board_a
    cpu_hz: 80000000
    measurement_method: uart_explicit_wolfboot_mailbox_markers
    repeated_run_model: phase_11_2_repeat_count_samples
    static_metrics_model: phase_11_3_elf_and_artifact_metrics
    runtime_memory_model: phase_11_4_firmware_side_stack_high_water_marker
    assumptions: ED25519 uses the same payload, board, clock, measurement method, repeated-run model, static metrics model, runtime memory model, and manifest schema as the ECC256 reference path.

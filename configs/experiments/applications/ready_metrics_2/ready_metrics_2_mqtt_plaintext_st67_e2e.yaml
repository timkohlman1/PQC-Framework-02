id: ready_metrics_2_mqtt_plaintext_st67_e2e
description: Ready Metrics 2 profile with paper-aligned broker-to-STM32 application TTLB, MQTT connection TTFB, firmware-boot, TLS, primitive, and memory instrumentation.
board: board_a
host: gateway
boot: direct_flash
firmware:
  application: mqtt_ready_metrics_2
  uart_log_level: info
  mode: direct_flash
  artifact: build/Release/stm32_basic_hal1.elf
network:
  wifi:
    ssid: pqc
    psk: lukeisadog
  ipv4:
    mode: dhcp
  packet_capture:
    enabled: true
    interface: any
mqtt:
  schema_version: 1
  enabled: true
  evidence_class: stm32_st67_plaintext_e2e
  transport_backend: st67w61m1_lwip_sockets
  broker_profile: classical
  broker:
    host: pqc-gateway1.pqcnet
    port: 1883
    server_name: pqc-gateway1.pqcnet
    dns_required: true
  client_id: pqc-stm32-e2e
  topics:
    command: pqc/experiments/stm32/command
    response: pqc/experiments/stm32/response
  transfer:
    payload_bytes: 204800
    chunk_bytes: 400
    request_topic: pqc/experiments/stm32/response/transfer/request
    response_topic: pqc/experiments/stm32/response/transfer/response
    request_payload: send
  correlation_payload: pqc-stm32-e2e-ok
  tls:
    mode: plaintext
  result_schema:
    timing_contract:
      ttfb_start: immediately_before_lwip_connect_after_dns
      ttfb_end: first_plaintext_byte_returned_while_receiving_mqtt_connack
      application_ttfb_end: first_byte_of_requested_application_payload
      ttlb_start: immediately_before_lwip_connect_after_dns
      ttlb_end: last_byte_of_requested_application_payload
      ttlb_direction: broker_to_stm32
      firmware_boot_origin: first_hal_tick_immediately_after_hal_init
    unavailable_metrics:
      tls_handshake: Plaintext MQTT does not perform a TLS handshake.
      mqtt_reconnect: Reconnect behaviour is outside this initial exchange.
      latency_ms: No synchronized end-to-end latency metric is recorded yet.
uart:
  expected_boot_message: stm32-basic_hal1 boot v0.1.0
  expected_tick_prefix: "[tick="

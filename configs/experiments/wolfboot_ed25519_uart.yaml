id: wolfboot_ed25519_uart
description: Flash wolfBoot and the signed ED25519 application image, then capture UART benchmark evidence.
board: board_a
host: gateway
boot: wolfboot_ed25519
boot_crypto: ed25519
firmware:
  mode: wolfboot_ed25519
  artifact: build/RelocatedDebug/stm32_basic_hal1_ed25519_v1_signed.bin
uart:
  expected_boot_message: stm32-basic_hal1 boot v0.1.0
  expected_tick_message: tick
  expected_secure_boot_message: stm32-basic_hal1 secure-boot app v0.1.0
secure_boot_benchmark_profile:
  schema_version: 1
  profile_model: configs/benchmarks/classical_signing_profiles.yaml
  profile_id: ed25519_benchmark
  algorithm: ED25519
  wolfboot_sign: ED25519
  signature_algorithm: ed25519
  signature_size_bytes: 64
  image_version: 1
  image_header_size_bytes: 8192
  runnable: true
  status: configured_phase_11_5b_ed25519_profile
  signing_profile: configs/signing/wolfboot_ed25519_app.yaml
  wolfboot_build_profile: configs/builds/wolfboot_stm32l4_ed25519.yaml
  experiment_profile: configs/experiments/wolfboot_ed25519_uart.yaml
  boot_profile: configs/boot/wolfboot_ed25519.yaml
  minimum_scope_status: phase_11_5b_ed25519_added_ecc256_reference_retained_rsa2048_reserved
  ed25519_status: configured_phase_11_5b_runnable_profile_not_hardware_validated
  rsa2048_status: planned_phase_11_5c_not_implemented
  application_payload: same_relocated_hal_application_payload
  board: board_a
  cpu_hz: 80000000
  measurement_method: uart_explicit_wolfboot_mailbox_markers
  repeated_run_model: phase_11_2_repeat_count_samples
  static_metrics_model: phase_11_3_elf_and_artifact_metrics
  runtime_memory_model: phase_11_4_firmware_side_stack_high_water_marker
  scope_limitations: Phase 11.5b adds the ED25519 runnable profile. RSA2048 remains reserved until Phase 11.5c and cross-profile aggregation remains Phase 11.6 scope.
secure_boot_flash:
  evidence_phase: phase_11_5b_ed25519_benchmark_profile
  signature_algorithm: ed25519
  signature_size_bytes: 64
  image_version: 1
  image_header_size_bytes: 8192
  wolfboot_artifact: tools/wolfboot/wolfboot.elf
  wolfboot_offset: 0x08000000
  wolfboot_pass_offset_to_helper: false
  unsigned_application_artifact: build/RelocatedDebug/stm32_basic_hal1_ed25519.bin
  signed_application_artifact: build/RelocatedDebug/stm32_basic_hal1_ed25519_v1_signed.bin
  signed_application_offset: 0x08020000
  signed_application_pass_offset_to_helper: true
  signing_private_key: secrets/wolfboot/ed25519_private_key.der
  wolfboot_private_key: tools/wolfboot/wolfboot_signing_private_key.der
  negative_test_corrupt_application: false
  boot_timing_source: uart_explicit_verification_time_marker
  boot_timing_expected_uart_pattern: "wolfBoot verification time: <milliseconds> ms"
  boot_timing_unavailable_behavior: record_null_verification_time_ms
  corruption_method: flip_first_byte
  corrupted_application_artifact: corrupted_application_signed.bin
  notes: Phase 11.5b uses the same relocated application payload and shared 8192-byte image-header reserve, UART markers, repeated-run model, static metrics model, runtime memory model, key-consistency evidence, and secure-boot benchmark manifest schema as the ECC256 reference profile. The secure-boot flash workflow refuses to flash when available ED25519 canonical and wolfBoot private-key fingerprints differ. Hardware success must only be claimed from user-provided flash and UART logs.

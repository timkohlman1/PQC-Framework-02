id: tls_handshake_first_telemetry_network_degradation
description: Controlled symmetric network degradation for TLS handshake through first device telemetry.
profiles:
  secp256r1_server_auth: configs/experiments/applications/ready_metrics/ready_metrics_mqtt_tls_secp256r1_server_auth_st67_e2e.yaml
  secp256r1_mutual_auth: configs/experiments/applications/ready_metrics/ready_metrics_mqtt_tls_secp256r1_mutual_auth_st67_e2e.yaml
  secp256r1mlkem768_server_auth: configs/experiments/applications/ready_metrics/ready_metrics_mqtt_tls_SecP256r1MLKEM768_server_auth_st67_e2e.yaml
  secp256r1mlkem768_mutual_auth: configs/experiments/applications/ready_metrics/ready_metrics_mqtt_tls_SecP256r1MLKEM768_mutual_auth_st67_e2e.yaml
dimensions:
  rate_kbit:
    rate_1000: 1000
    rate_250: 250
    rate_100: 100
  rtt_ms:
    rtt_50: 50
    rtt_100: 100
    rtt_200: 200
  loss_percent:
    loss_0: 0
    loss_5: 5
    loss_10: 10
  mtu:
    mtu_1500: 1500
measurement:
  workload: mqtt_ready_metrics
  start: immediately_before_tcp_connect
  end: first_ready_telemetry_publish_complete
  clock: stm32_monotonic_hal_tick
  includes_tls_handshake: true
network_model:
  symmetric_rate: true
  symmetric_rtt: true
  loss_sampling: independent_per_direction

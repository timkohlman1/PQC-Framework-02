id: wolfboot_stm32l4_ecdsa_p256
description: Build profile for wolfBoot targeting the planned STM32L4R5 ECDSA-P256 secure-boot configuration.
status: configured_phase_10f1_project_local_target_adaptation_build_only_not_boot_validated
dependency_strategy: git_submodule
source_dir: tools/wolfboot
output_dir: tools/wolfboot
artifact: tools/wolfboot/wolfboot.elf
target: stm32l4r5_project_local
signature_algorithm: ecdsa_p256
classical_benchmark_profile:
  model: configs/benchmarks/classical_signing_profiles.yaml
  profile_id: ecc256_reference
  algorithm: ECC256
  wolfboot_sign: ECC256
  curve: P-256
  key_size_bits: 256
  signature_size_bytes: 64
  reference_path: true
  minimum_scope_member: true
boot_profile: wolfboot_ecdsa_p256
layout_decision: docs/decisions/0003_secure_boot_flash_layout.md
target_support_decision: docs/decisions/0002_wolfboot_stm32l4_target_support_assessment.md
build:
  command: make
  args: "WOLFBOOT_ROOT=. wolfboot.elf"
  config_template: configs/wolfboot/stm32l4r5_ecdsa_p256.config
  generated_config: tools/wolfboot/.config
  mingw_keytools_ansi_stdio_patch: true
  stm32l4_hal_conf_pwr_patch: true
  boot_timing_instrumentation_patch: true
  runtime_stack_high_water_instrumentation: true
  signing_key: secrets/wolfboot/ecdsa_p256_private_key.der
  wolfboot_private_key: tools/wolfboot/wolfboot_signing_private_key.der
  generated_keystore: tools/wolfboot/src/keystore.c
notes: This profile is build-only and is the ECC256 reference wolfBoot build profile for the Phase 11.5a minimum classical comparison scope. The framework copies the tracked project-local wolfBoot config template to tools/wolfboot/.config, applies temporary MinGW host-keytools stdio, STM32L4 HAL PWR-include compatibility, and Phase 10k boot-timing instrumentation patches when requested, then invokes make inside the local wolfBoot submodule with WOLFBOOT_ROOT=. wolfboot.elf so wolfBoot host-tool paths remain relative to the submodule root on Windows/MSYS and the Phase 10f.1 build stops after the bootloader ELF target instead of also attempting wolfBoot test-application image generation. It coordinates the local signing key used by wolfBoot keystore generation with the framework signing profile, but does not copy private key material into results, sign application images, flash hardware, capture UART, or prove secure-boot runtime behaviour. The boot-timing patch is build-time instrumentation only; timing and runtime stack evidence are confirmed only when a subsequent secure-boot UART run contains explicit wolfBoot verification timing and max-stack markers and the manifest records verification_time_ms, verification_cycles, and max_stack_used_bytes as numbers.

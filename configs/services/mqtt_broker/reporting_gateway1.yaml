schema_version: 1
profile_type: service
service_type: mqtt_broker
id: reporting_gateway1
description: Mandatory plaintext result/control broker isolated from experiment impairment.
mandatory: true
deployment:
  tool: mosquitto
  instance: reporting
transport: plaintext
listener:
  host: pqc-gateway1.pqcnet
  port: 1886
tls:
  enabled: false
  pki_required: false
topics:
  stm32_results: pqc/result/stm32/{run_id}/#
  instrument_results: pqc/instrument/+/{run_id}/#
  control: pqc/control/#
  current_run_id: pqc/control/run-id/current
collector:
  required: true
  access: local_gateway
network:
  path: host_control
  impairment_exempt: true
acl:
  enabled: true

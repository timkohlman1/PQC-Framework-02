services:
  mqtt-classical:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    profiles: ["classical"]
    ports:
      - "${MQTT_CLASSICAL_TLS_PORT:-8883}:8883"
    volumes:
      - ./config/classical/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./config/classical/aclfile:/mosquitto/config/aclfile:ro
      - ./runtime/classical/certs:/mosquitto/config/certs:ro
      - ./data/classical:/mosquitto/data
      - ./log/classical:/mosquitto/log
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h 127.0.0.1 -p 8883 --cafile /mosquitto/config/certs/ca.crt --cert /mosquitto/config/certs/client.crt --key /mosquitto/config/certs/client.key -t '$$SYS/broker/version' -C 1 -W 5 >/dev/null 2>&1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mqtt-oqs:
    image: openquantumsafe/mosquitto:latest
    restart: unless-stopped
    profiles: ["oqs"]
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    ports:
      - "${MQTT_OQS_TLS_PORT:-8884}:8883"
    environment:
      OPENSSL_CONF: "/opt/oqssa/ssl/openssl.cnf"
      OPENSSL_MODULES: "/opt/oqssa/lib64/ossl-modules"
    volumes:
      - ./config/oqs/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./config/oqs/aclfile:/mosquitto/config/aclfile:ro
      - ./runtime/oqs/certs:/mosquitto/config/certs:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "timeout 8 sh -c \"echo | openssl s_client -connect 127.0.0.1:8883 -tls1_3 -groups mlkem768 -CAfile /mosquitto/config/certs/ca.crt -cert /mosquitto/config/certs/healthcheck.crt -key /mosquitto/config/certs/healthcheck.key -verify_return_error 2>&1\" | grep -q 'Verify return code: 0 (ok)'",
        ]
      interval: 30s
      timeout: 12s
      retries: 3
      start_period: 10s

id: wolfboot_ecdsa_p256_uart
description: Flash wolfBoot and the signed ECDSA-P256 application image, then capture UART evidence.
board: board_a
host: gateway
boot: wolfboot_ecdsa_p256
boot_crypto: ecdsa_p256
firmware:
  mode: wolfboot_ecdsa_p256
  artifact: build/RelocatedDebug/stm32_basic_hal1_v1_signed.bin
uart:
  expected_boot_message: stm32-basic_hal1 boot v0.1.0
  expected_tick_message: tick
  expected_secure_boot_message: stm32-basic_hal1 secure-boot app v0.1.0
secure_boot_benchmark_profile:
  schema_version: 1
  profile_model: configs/benchmarks/classical_signing_profiles.yaml
  profile_id: ecc256_reference
  algorithm: ECC256
  wolfboot_sign: ECC256
  signature_algorithm: ecdsa_p256
  curve: P-256
  key_size_bits: 256
  signature_size_bytes: 64
  image_version: 1
  image_header_size_bytes: 8192
  runnable: true
  status: reference_existing_phase_10_11_profile
  signing_profile: configs/signing/wolfboot_ecdsa_p256_app.yaml
  wolfboot_build_profile: configs/builds/wolfboot_stm32l4_ecdsa_p256.yaml
  experiment_profile: configs/experiments/wolfboot_ecdsa_p256_uart.yaml
  boot_profile: configs/boot/wolfboot_ecdsa_p256.yaml
  minimum_scope_status: defined_phase_11_5a_minimum_classical_scope
  ed25519_status: planned_phase_11_5b_not_implemented
  rsa2048_status: planned_phase_11_5c_not_implemented
  application_payload: same_relocated_hal_application_payload
  board: board_a
  cpu_hz: 80000000
  measurement_method: uart_explicit_wolfboot_mailbox_markers
  repeated_run_model: phase_11_2_repeat_count_samples
  static_metrics_model: phase_11_3_elf_and_artifact_metrics
  runtime_memory_model: phase_11_4_firmware_side_stack_high_water_marker
  scope_limitations: Phase 11.5a defines the profile model only; ED25519 and RSA2048 runnable profiles are added in later sub-phases.
secure_boot_flash:
  evidence_phase: phase_11_5a_classical_profile_model
  signature_algorithm: ecdsa_p256
  signature_size_bytes: 64
  image_version: 1
  image_header_size_bytes: 8192
  wolfboot_artifact: tools/wolfboot/wolfboot.elf
  wolfboot_offset: 0x08000000
  wolfboot_pass_offset_to_helper: false
  unsigned_application_artifact: build/RelocatedDebug/stm32_basic_hal1.bin
  signed_application_artifact: build/RelocatedDebug/stm32_basic_hal1_v1_signed.bin
  signed_application_offset: 0x08020000
  signed_application_pass_offset_to_helper: true
  signing_private_key: secrets/wolfboot/ecdsa_p256_private_key.der
  wolfboot_private_key: tools/wolfboot/wolfboot_signing_private_key.der
  negative_test_corrupt_application: false
  boot_timing_source: uart_explicit_verification_time_marker
  boot_timing_expected_uart_pattern: "wolfBoot verification time: <milliseconds> ms"
  boot_timing_unavailable_behavior: record_null_verification_time_ms
  corruption_method: flip_first_byte
  corrupted_application_artifact: corrupted_application_signed.bin
  notes: Phase 10i requires the secure-boot application UART marker in addition to the normal boot and tick markers. Phase 10j can be run with --negative-corrupt-application to flash a result-local corrupted copy of the signed image without modifying the original signed image or private signing key. Phase 10k records verification_time_ms only when an explicit wolfBoot verification-time UART line is captured; otherwise the manifest records null timing with the unavailable source and limitations. Phase 10l records consolidated secure_boot_evidence linking flash, signing, UART, timing, result, and negative-test evidence. Phase 11.3 records static wolfBoot section/resource metrics and signed-image overhead where artifacts are available. Phase 11.4 records maximum stack high-water evidence only when the instrumented secure-boot firmware emits an explicit UART stack marker; heap metrics remain unavailable unless explicit firmware-side heap evidence is emitted. Phase 11.5a records the ECC256 reference profile metadata and reserves ED25519 and RSA2048 in the minimum comparison scope without adding those runnable profiles yet.

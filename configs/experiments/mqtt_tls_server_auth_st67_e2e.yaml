id: mqtt_tls_server_auth_st67_e2e
description: Classical server-authenticated MQTT over TLS from STM32 through ST67W61M1 to the gateway broker.
board: board_a
host: gateway
boot: direct_flash
firmware:
  mode: direct_flash
  artifact: build/Debug/stm32_basic_hal1.elf
network:
  wifi:
    ssid: pqc
    psk: lukeisadog
  ipv4:
    mode: dhcp
mqtt:
  schema_version: 1
  enabled: true
  evidence_class: stm32_st67_classical_tls_e2e
  transport_backend: st67w61m1_lwip_wolfssl
  broker_profile: classical-server-auth
  broker:
    host: 10.1.1.18
    port: 8883
    server_name: pqc-gateway1
  client_id: pqc-stm32-tls-e2e
  topics:
    command: pqc/experiments/stm32/tls/command
    response: pqc/experiments/stm32/tls/response
  command_payload: run
  correlation_payload: pqc-stm32-tls-e2e-ok
  reconnect_attempts: 1
  tls:
    mode: classical_tls_server_auth
    certificate_refs:
      ca_certificate: experiment/mqtt-broker/runtime/classical/certs/ca.crt
  result_schema:
    unavailable_metrics:
      latency_ms: No synchronized end-to-end latency metric is recorded.
      throughput_bytes_per_second: The bounded control exchange does not establish throughput.
uart:
  expected_boot_message: stm32-basic_hal1 boot v0.1.0
  expected_tick_message: tick

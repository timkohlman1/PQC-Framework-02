services:
  mqtt-classical:
    image: eclipse-mosquitto:2.1.2-alpine@sha256:6f8d8a947c506f8a2290ec65cd4bd2bc7cb4d43fb5f6271f861cb013e2ef9797
    restart: unless-stopped
    profiles: ["classical"]
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        rm -rf /tmp/mosquitto-certs
        mkdir -p /tmp/mosquitto-certs
        cp /mosquitto/config/certs/ca.crt /tmp/mosquitto-certs/ca.crt
        cp /mosquitto/config/certs/ca-chain.crt /tmp/mosquitto-certs/ca-chain.crt
        cp /mosquitto/config/certs/intermediate-ca.crt /tmp/mosquitto-certs/intermediate-ca.crt
        cat /mosquitto/config/certs/server.crt /mosquitto/config/certs/intermediate-ca.crt > /tmp/mosquitto-certs/server.crt
        cp /mosquitto/config/certs/server.key /tmp/mosquitto-certs/server.key
        if id mosquitto >/dev/null 2>&1; then
          runtime_user="$(id -u mosquitto)"
          runtime_group="$(id -g mosquitto)"
        elif id nobody >/dev/null 2>&1; then
          runtime_user="$(id -u nobody)"
          runtime_group="$(id -g nobody)"
        else
          runtime_user=0
          runtime_group=0
        fi
        chown "$$runtime_user:$$runtime_group" /tmp/mosquitto-certs/*
        chmod 0640 /tmp/mosquitto-certs/server.key
        chmod 0644 /tmp/mosquitto-certs/ca.crt /tmp/mosquitto-certs/ca-chain.crt /tmp/mosquitto-certs/intermediate-ca.crt /tmp/mosquitto-certs/server.crt
        mkdir -p /mosquitto/keylog
        rm -f /mosquitto/keylog/mqtt-broker-tls-keylog.log
        chown "$$runtime_user:$$runtime_group" /mosquitto/keylog
        chmod 0700 /mosquitto/keylog
        umask 077
        exec mosquitto --tls-keylog /mosquitto/keylog/mqtt-broker-tls-keylog.log -c /mosquitto/config/mosquitto.conf
    ports:
      - "127.0.0.1:1884:1884"
      - "${MQTT_PLAINTEXT_PORT:-1883}:1883"
      - "${MQTT_CLASSICAL_TLS_PORT:-8883}:8883"
    volumes:
      - ./config/classical/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./config/classical/aclfile:/mosquitto/config/aclfile.source:ro
      - ../../secrets/certificates/${MQTT_CERTIFICATE_PROFILE:-rsa3072}:/mosquitto/config/certs:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/version' -C 1 -W 5 >/dev/null 2>&1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mqtt-classical-server-auth:
    image: eclipse-mosquitto:2.1.2-alpine@sha256:6f8d8a947c506f8a2290ec65cd4bd2bc7cb4d43fb5f6271f861cb013e2ef9797
    restart: unless-stopped
    profiles: ["classical-server-auth"]
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        rm -rf /tmp/mosquitto-certs
        mkdir -p /tmp/mosquitto-certs
        cp /mosquitto/config/certs/ca.crt /tmp/mosquitto-certs/ca.crt
        cp /mosquitto/config/certs/intermediate-ca.crt /tmp/mosquitto-certs/intermediate-ca.crt
        cat /mosquitto/config/certs/server.crt /mosquitto/config/certs/intermediate-ca.crt > /tmp/mosquitto-certs/server.crt
        cp /mosquitto/config/certs/server.key /tmp/mosquitto-certs/server.key
        if id mosquitto >/dev/null 2>&1; then
          runtime_user="$(id -u mosquitto)"
          runtime_group="$(id -g mosquitto)"
        elif id nobody >/dev/null 2>&1; then
          runtime_user="$(id -u nobody)"
          runtime_group="$(id -g nobody)"
        else
          runtime_user=0
          runtime_group=0
        fi
        chown "$$runtime_user:$$runtime_group" /tmp/mosquitto-certs/*
        chmod 0640 /tmp/mosquitto-certs/server.key
        chmod 0644 /tmp/mosquitto-certs/ca.crt /tmp/mosquitto-certs/intermediate-ca.crt /tmp/mosquitto-certs/server.crt
        mkdir -p /mosquitto/keylog
        rm -f /mosquitto/keylog/mqtt-broker-tls-keylog.log
        chown "$$runtime_user:$$runtime_group" /mosquitto/keylog
        chmod 0700 /mosquitto/keylog
        umask 077
        exec mosquitto --tls-keylog /mosquitto/keylog/mqtt-broker-tls-keylog.log -c /mosquitto/config/mosquitto.conf
    ports:
      - "127.0.0.1:1884:1884"
      - "${MQTT_CLASSICAL_SERVER_AUTH_TLS_PORT:-8883}:8883"
    volumes:
      - ./config/classical-server-auth/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ../../secrets/certificates/${MQTT_CERTIFICATE_PROFILE:-rsa3072}:/mosquitto/config/certs:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h 127.0.0.1 -p 8883 --cafile /tmp/mosquitto-certs/ca.crt --insecure --tls-version tlsv1.3 -t '$$SYS/broker/version' -C 1 -W 5 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  mqtt-oqs:
    image: eclipse-mosquitto:2.1.2-alpine@sha256:6f8d8a947c506f8a2290ec65cd4bd2bc7cb4d43fb5f6271f861cb013e2ef9797
    restart: unless-stopped
    profiles: ["oqs"]
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        rm -rf /tmp/mosquitto-certs
        mkdir -p /tmp/mosquitto-certs
        cp /mosquitto/config/certs/ca.crt /tmp/mosquitto-certs/ca.crt
        cp /mosquitto/config/certs/intermediate-ca.crt /tmp/mosquitto-certs/intermediate-ca.crt
        cat /mosquitto/config/certs/server.crt /mosquitto/config/certs/intermediate-ca.crt > /tmp/mosquitto-certs/server.crt
        cp /mosquitto/config/certs/server.key /tmp/mosquitto-certs/server.key
        if id nobody >/dev/null 2>&1; then
          runtime_user="$(id -u nobody)"
          runtime_group="$(id -g nobody)"
        else
          runtime_user=0
          runtime_group=0
        fi
        chown "$$runtime_user:$$runtime_group" /tmp/mosquitto-certs/*
        chmod 0640 /tmp/mosquitto-certs/server.key
        chmod 0644 /tmp/mosquitto-certs/ca.crt /tmp/mosquitto-certs/intermediate-ca.crt /tmp/mosquitto-certs/server.crt
        mkdir -p /mosquitto/keylog
        rm -f /mosquitto/keylog/mqtt-broker-tls-keylog.log
        chown "$$runtime_user:$$runtime_group" /mosquitto/keylog
        chmod 0700 /mosquitto/keylog
        umask 077
        exec mosquitto --tls-keylog /mosquitto/keylog/mqtt-broker-tls-keylog.log -c /mosquitto/config/mosquitto.conf
    ports:
      - "127.0.0.1:1884:1884"
      - "${MQTT_OQS_TLS_PORT:-8884}:8883"
    environment:
      OPENSSL_CONF: "/mosquitto/config/openssl.cnf"
    volumes:
      - ./config/oqs/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./config/oqs/openssl.cnf:/mosquitto/config/openssl.cnf:ro
      - ./config/oqs/aclfile:/mosquitto/config/aclfile.source:ro
      - ../../secrets/certificates/${MQTT_CERTIFICATE_PROFILE:-rsa3072}:/mosquitto/config/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 8883 --cafile /tmp/mosquitto-certs/ca.crt --insecure --tls-version tlsv1.3 -t pqc/framework/health -m ready >/dev/null 2>&1"]
      interval: 30s
      timeout: 12s
      retries: 3
      start_period: 10s

  mqtt-oqs-mtls:
    image: eclipse-mosquitto:2.1.2-alpine@sha256:6f8d8a947c506f8a2290ec65cd4bd2bc7cb4d43fb5f6271f861cb013e2ef9797
    restart: unless-stopped
    profiles: ["oqs-mtls"]
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        rm -rf /tmp/mosquitto-certs
        mkdir -p /tmp/mosquitto-certs
        cp /mosquitto/config/certs/ca.crt /tmp/mosquitto-certs/ca.crt
        cp /mosquitto/config/certs/ca-chain.crt /tmp/mosquitto-certs/ca-chain.crt
        cp /mosquitto/config/certs/intermediate-ca.crt /tmp/mosquitto-certs/intermediate-ca.crt
        cat /mosquitto/config/certs/server.crt /mosquitto/config/certs/intermediate-ca.crt > /tmp/mosquitto-certs/server.crt
        cp /mosquitto/config/certs/server.key /tmp/mosquitto-certs/server.key
        cp /mosquitto/config/certs/healthcheck.crt /tmp/mosquitto-certs/healthcheck.crt
        cp /mosquitto/config/certs/healthcheck.key /tmp/mosquitto-certs/healthcheck.key
        if id nobody >/dev/null 2>&1; then
          runtime_user="$(id -u nobody)"
          runtime_group="$(id -g nobody)"
        else
          runtime_user=0
          runtime_group=0
        fi
        chown "$$runtime_user:$$runtime_group" /tmp/mosquitto-certs/*
        chmod 0640 /tmp/mosquitto-certs/server.key /tmp/mosquitto-certs/healthcheck.key
        chmod 0644 /tmp/mosquitto-certs/ca.crt /tmp/mosquitto-certs/ca-chain.crt /tmp/mosquitto-certs/intermediate-ca.crt /tmp/mosquitto-certs/server.crt /tmp/mosquitto-certs/healthcheck.crt
        mkdir -p /mosquitto/keylog
        rm -f /mosquitto/keylog/mqtt-broker-tls-keylog.log
        chown "$$runtime_user:$$runtime_group" /mosquitto/keylog
        chmod 0700 /mosquitto/keylog
        umask 077
        exec mosquitto --tls-keylog /mosquitto/keylog/mqtt-broker-tls-keylog.log -c /mosquitto/config/mosquitto.conf
    ports:
      - "127.0.0.1:1884:1884"
      - "${MQTT_OQS_MTLS_PORT:-8885}:8883"
    environment:
      OPENSSL_CONF: "/mosquitto/config/openssl.cnf"
    volumes:
      - ./config/oqs-mtls/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./config/oqs-mtls/openssl.cnf:/mosquitto/config/openssl.cnf:ro
      - ./config/oqs-mtls/aclfile:/mosquitto/config/aclfile.source:ro
      - ../../secrets/certificates/${MQTT_CERTIFICATE_PROFILE:-rsa3072}:/mosquitto/config/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 8883 --cafile /tmp/mosquitto-certs/ca.crt --insecure --cert /tmp/mosquitto-certs/healthcheck.crt --key /tmp/mosquitto-certs/healthcheck.key --tls-version tlsv1.3 -q 1 -t pqc/framework/health -m ready >/dev/null 2>&1"]
      interval: 30s
      timeout: 12s
      retries: 3
      start_period: 10s

  mqtt-reporting:
    image: eclipse-mosquitto:2.1.2-alpine@sha256:6f8d8a947c506f8a2290ec65cd4bd2bc7cb4d43fb5f6271f861cb013e2ef9797
    restart: unless-stopped
    profiles: ["reporting"]
    ports:
      - "${MQTT_REPORTING_PORT:-1886}:1886"
    volumes:
      - ./config/reporting/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./config/reporting/aclfile:/mosquitto/config/aclfile:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1886 -q 1 -t pqc/control/health -m ready -r >/dev/null 2>&1 && test \"$$(mosquitto_sub -h 127.0.0.1 -p 1886 -t pqc/control/health -C 1 -W 3 2>/dev/null)\" = ready && mosquitto_pub -h 127.0.0.1 -p 1886 -q 1 -t pqc/control/health -n -r >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 5s

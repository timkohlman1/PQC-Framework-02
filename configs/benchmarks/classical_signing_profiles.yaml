id: secure_boot_signing
description: Secure-boot signing benchmark suite. Algorithm properties and workflow paths are resolved from canonical algorithm profiles.
schema_version: 2
benchmark_scope: secure_boot_signing_algorithm
reference_algorithm: ecdsa_p256
minimum_algorithms:
  ed25519: true
  ecdsa_p256: true
  rsa2048: true
expanded_algorithms:
  ecc384: true
  ecc521: true
  ed448: true
  rsa3072: true
  rsa4096: true
post_quantum_algorithms:
  mldsa44: true
  mldsa65: true
unavailable_algorithms:
  mldsa87:
    reason: Requires a 12288-byte image header; the current target uses 8192 bytes.
common_evidence:
  board: board_a
  application_payload: same_relocated_hal_application_payload
  measurement_method: uart_explicit_wolfboot_mailbox_markers
  repeated_run_model: phase_11_2_repeat_count_samples
  static_metrics_model: phase_11_3_elf_and_artifact_metrics
  runtime_memory_model: phase_11_4_firmware_side_stack_high_water_marker

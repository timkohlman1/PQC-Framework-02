id: ready_metrics_mqtt_tls_X25519MLKEM768_mldsa65_mutual_auth_st67_e2e
description: Ready/connection-timing/periodic-memory application profile using X25519MLKEM768 ML-DSA-65 mutual-authenticated MQTT over TLS 1.3 from STM32 through ST67W61M1 to the gateway broker.
board: board_a
host: gateway
boot: direct_flash
firmware:
  application: mqtt_ready_metrics
  mode: direct_flash
  artifact: build/Release/stm32_basic_hal1.elf
network:
  wifi:
    ssid: pqc
    psk: lukeisadog
  ipv4:
    mode: dhcp
  packet_capture:
    enabled: true
    interface: enp0s31f6
mqtt:
  schema_version: 1
  enabled: true
  evidence_class: stm32_st67_pqc_hybrid_tls_e2e
  transport_backend: st67w61m1_lwip_wolfssl
  broker_profile: oqs-mtls
  broker:
    host: pqc-gateway1.pqcnet
    port: 8885
    server_name: pqc-gateway1.pqcnet
    dns_required: true
  client_id: pqc-stm32-x25519mlkem768-mldsa65-mtls-e2e
  topics:
    command: pqc/experiments/stm32/x25519mlkem768/mldsa65/mutual_auth/command
    response: pqc/experiments/stm32/x25519mlkem768/mldsa65/mutual_auth/response
  command_payload: run
  correlation_payload: pqc-stm32-x25519mlkem768-mldsa65-mtls-e2e-ok
  reconnect_attempts: 1
  orchestration:
    host: 10.1.1.18
    completion_grace_seconds: 3
    hard_limit_seconds: 180
  tls:
    tls_version: tls1.3
    mode: pqc_hybrid_tls_mutual
    authentication: mutual
    key_exchange_group: X25519MLKEM768
    server_signature_algorithm: mldsa65
    certificate_profile: mldsa65-pqc
    certificate_authority_algorithm: mldsa65-x509
    server_certificate_algorithm: mldsa65
  result_schema:
    unavailable_metrics:
      latency_ms: No synchronized end-to-end latency metric is recorded.
      throughput_bytes_per_second: The bounded control exchange does not establish throughput.
uart:
  expected_boot_message: stm32-basic_hal1 boot v0.1.0
  expected_tick_message: tick

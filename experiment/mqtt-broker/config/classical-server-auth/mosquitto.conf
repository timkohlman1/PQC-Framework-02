persistence false
log_dest stdout
log_type all
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

user mosquitto
listener 8883 0.0.0.0
protocol mqtt
listener_allow_anonymous true
cafile /tmp/mosquitto-certs/ca.crt
certfile /tmp/mosquitto-certs/server.crt
keyfile /tmp/mosquitto-certs/server.key
require_certificate false
tls_version tlsv1.3

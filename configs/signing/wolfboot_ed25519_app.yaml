id: wolfboot_ed25519_app
description: Sign the relocated STM32 HAL application image for the wolfBoot ED25519 primary slot benchmark profile.
status: configured_phase_11_5b_signing_only_not_flashing_or_boot_validated
boot_profile: wolfboot_ed25519
relocated_build_preset: RelocatedDebug
input_elf: build/RelocatedDebug/stm32_basic_hal1.elf
input_image: build/RelocatedDebug/stm32_basic_hal1_ed25519.bin
signed_image: build/RelocatedDebug/stm32_basic_hal1_ed25519_v1_signed.bin
retained_signed_image: application_signed.bin
signature_algorithm: ed25519
signature_size_bytes: 64
classical_benchmark_profile:
  model: configs/benchmarks/classical_signing_profiles.yaml
  profile_id: ed25519_benchmark
  algorithm: ED25519
  wolfboot_sign: ED25519
  signature_size_bytes: 64
  reference_path: false
  minimum_scope_member: true
image_version: 1
image_header_size_bytes: 8192
private_key: secrets/wolfboot/tuples/ed25519-development/private_key.der
key_policy: local_private_key_never_commit
binary_conversion:
  enabled: true
  command: arm-none-eabi-objcopy
  args: "-O binary {input_elf} {input_image}"
keygen:
  enabled: false
  working_dir: tools/wolfboot
  command: tools/keytools/keygen
  args: "--ed25519 -g {private_key}"
  stdin: "Yes\n"
sign:
  working_dir: tools/wolfboot
  environment:
    IMAGE_HEADER_SIZE: "8192"
  command: tools/keytools/sign
  args: "--ed25519 {input_image} {private_key} {image_version}"
signing_tuple:
  tuple_id: ed25519-development
  directory: secrets/wolfboot/tuples/ed25519-development
  manifest: tuple.json
notes: This profile is signing-only for the Phase 11.5b ED25519 benchmark profile. The private key path is intentionally under secrets/ and must remain local. The matching wolfBoot build profile initializes the complete persistent signing tuple when it is entirely absent; application signing never generates a private key by itself, converts the relocated ELF to the configured BIN image when needed, signs the BIN image with the shared 8192-byte Phase 11 image-header reserve, records signing metadata under results/signing, and retains only the signed image artifact. It does not copy private keys into results, flash hardware, capture UART, or prove secure-boot runtime behaviour.

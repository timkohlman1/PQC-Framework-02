# ---------- Reusable templates ----------
x-cert-env: &cert_env
  CERT_KTY: RSA
  CERT_RSA_BITS: 3072
  CERT_EC_CURVE: P-256
  CERT_MODE: server   # server|client
  CERT_KEY_UID: "0"
  CERT_KEY_GID: "0"

x-cert-sidecar: &cert_sidecar
  image: smallstep/step-cli:0.28.7
  user: "0:0"
  env_file:
    - ./.env.stepca
  environment: *cert_env
  command: >-
    sh -c '
      set -euo pipefail
      printf "%s" "$${DOCKER_STEPCA_INIT_PASSWORD}" > /tmp/prov.pw

      # pick filenames by mode
      if [ "$${CERT_MODE}" = "client" ]; then
        CRT=/certs/client.crt; KEY=/certs/client.key
      else
        CRT=/certs/tls.crt; KEY=/certs/tls.key
      fi

      # issue if missing/invalid
      if [ -s "$$CRT" ] && step certificate inspect "$$CRT" >/dev/null 2>&1; then
        echo "[cert] Existing certificate found — skipping issuance."
      else
        echo "[cert] No certificate found — issuing new one."
        SANS_ARGS=""
        OLD_IFS=$$IFS
        IFS=,
        for san in $${CERT_SANS:-}; do
          [ -n "$$san" ] && SANS_ARGS="$$SANS_ARGS --san $$san"
        done
        IFS=$$OLD_IFS
        if [ "$${CERT_KTY}" = "EC" ]; then
          step ca certificate --root /trust/ca.crt --ca-url "$${STEP_CA_URL}" $$SANS_ARGS "$${CERT_CN}" "$$CRT" "$$KEY" --kty EC --curve "$${CERT_EC_CURVE}" --provisioner "$${DOCKER_STEPCA_INIT_PROVISIONER_NAME}" --provisioner-password-file /tmp/prov.pw
        else
          step ca certificate --root /trust/ca.crt --ca-url "$${STEP_CA_URL}" $$SANS_ARGS "$${CERT_CN}" "$$CRT" "$$KEY" --kty RSA --size "$${CERT_RSA_BITS}" --provisioner "$${DOCKER_STEPCA_INIT_PROVISIONER_NAME}" --provisioner-password-file /tmp/prov.pw
        fi
        cp /trust/ca.crt /certs/ca.crt
      fi

      # Publish trust and presentation chains alongside the issued identity.
      cp -f /trust/ca.crt /certs/ca.crt
      cp -f /trust/intermediate-ca.crt /certs/intermediate-ca.crt
      cp -f /trust/ca-chain.crt /certs/ca-chain.crt
      if [ "$${CERT_MODE}" = "client" ]; then
        cat "$$CRT" /trust/intermediate-ca.crt > /certs/client-chain.crt
      else
        cat "$$CRT" /trust/intermediate-ca.crt > /certs/tls-chain.crt
      fi

      # permissions/ownership
      if [ "$${CERT_MODE}" = "client" ]; then
        # libpq allows 0640 owned by root:group (reader in group)
        chown 0:"$${CERT_KEY_GID}" "$$KEY"
        chmod 0640 "$$KEY"
      else
        # server keys: strict 0600 owned by service user
        chown "$${CERT_KEY_UID}":"$${CERT_KEY_GID}" "$$KEY"
        chmod 0600 "$$KEY"
      fi
      chmod 0644 "$$CRT" /certs/ca.crt /certs/intermediate-ca.crt /certs/ca-chain.crt
      if [ "$${CERT_MODE}" = "client" ]; then
        chmod 0644 /certs/client-chain.crt
      else
        chmod 0644 /certs/tls-chain.crt
      fi

      rm -f /tmp/prov.pw

      # renew in background
      step ca renew --root /trust/ca.crt --ca-url "$${STEP_CA_URL}" "$$CRT" "$$KEY" --daemon
    '
  volumes:
    - ./secrets/public/ca:/trust:ro
  networks: [security_services_net]
  healthcheck:
    test:
    - CMD-SHELL
    - >
      test -s /certs/ca.crt &&
      test -s /certs/intermediate-ca.crt &&
      { test -s /certs/tls-chain.crt || test -s /certs/client-chain.crt; }
    interval: 10s
    timeout: 3s
    retries: 30
    start_period: 5s
  depends_on:
    stepca:
      condition: service_healthy
    stepca_secure_root:
      condition: service_completed_successfully
  restart: unless-stopped

services:

  # =============d============
  # SECURITY SERVICES: CA
  # =========================

  stepca:
    image: smallstep/step-ca:0.28.4
    restart: unless-stopped
    expose: ["9000"]
    env_file:
      - ./.env.stepca
    volumes:
      - stepca-data:/home/step
    networks:
      - security_services_net
    healthcheck:
      test: ["CMD", "step", "ca", "health", "--ca-url", "https://stepca:9000"]
      interval: 5s
      timeout: 2s
      retries: 20

  # Archive the root key in Vault, remove it from the online step-ca state,
  # and publish only public CA certificates to the host-visible public folder.
  stepca_secure_root:
    build:
      context: ./services/kms/vault-init
    user: "0:0"
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_KV_MOUNT: pqc-secrets
      VAULT_ROOT_CA_PATH: ca/root/classical
      ROOT_TOKEN_FILE: /state/root.token
      STEPCA_DIR: /stepca
      PUBLIC_DIR: /public
    command: ["python", "/app/archive_root.py"]
    volumes:
      - ./services/stepca-root/archive_root.py:/app/archive_root.py:ro
      - stepca-data:/stepca
      - vault-state:/state:ro
      - ./secrets/public/ca:/public
    networks:
      - security_services_net
    depends_on:
      stepca:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    restart: "no"

  # =========================
  # SECURITY SERVICES: CERTIFICATE PUBLISHING SIDECARS
  # =========================

  mqtt-broker_cert:
    <<: *cert_sidecar
    environment:
      <<: *cert_env
      CERT_MODE: server
      CERT_CN: mqtt-broker
      CERT_SANS: mqtt-broker,localhost,pqc-gateway1.pqcnet
    volumes:
      - ./secrets/runtime/mqtt-broker:/certs
      - ./secrets/public/ca:/trust:ro
  stm32_client_cert:
    <<: *cert_sidecar
    environment:
      <<: *cert_env
      CERT_MODE: client
      CERT_CN: stm32-mqtt-client
      CERT_SANS: stm32-mqtt-client
    volumes:
      - ./secrets/runtime/stm32:/certs
      - ./secrets/public/ca:/trust:ro

  localstack_server_cert:
    <<: *cert_sidecar
    environment:
      <<: *cert_env
      CERT_MODE: server
      CERT_CN: localstack
      CERT_SANS: localstack,localstack
      CERT_KEY_UID: "0"
      CERT_KEY_GID: "0"
    volumes:
      - ./secrets/runtime/localstack:/certs
      - ./secrets/public/ca:/trust:ro

volumes:
  stepca-data:
  stepca-pkitrust:
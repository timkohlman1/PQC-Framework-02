id: gateway
alias: pqc-gateway1.pqcnet
short_alias: pqc-gateway1
user: timk
description: Experiment gateway used for remote flashing, UART capture, and gateway-hosted experiment services.
network:
  address: 10.1.1.18
  description: Stable gateway IP address for TLS, MQTT, Docker, or other workflows where the SSH alias is not resolvable through DNS.
flash:
  helper: flash-stm32a
reset:
  helper: reset-stm32a
uart:
  device: /dev/serial/by-id/usb-STMicroelectronics_STM32_STLink_066EFF3932504E3043111818-if02
  baud: 115200

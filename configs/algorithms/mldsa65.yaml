id: mldsa65
target: stm32l4r5_wolfboot
profiles:
  build:
    id: wolfboot_stm32l4_mldsa65
    description: Build profile for wolfBoot targeting the STM32L4R5 ML-DSA-65 secure-boot benchmark configuration.
    status: configured_post_phase_11_mldsa_build_only_not_boot_validated
    signature_algorithm: mldsa65
    mldsa_benchmark_profile:
      model: configs/benchmarks/classical_signing_profiles.yaml
      profile_id: mldsa65_benchmark
      algorithm: ML-DSA-65
      wolfboot_sign: ML_DSA
      mldsa_level: 3
      security_category: 3
      public_key_size_bytes: 1952
      private_key_size_bytes: 4032
      signature_size_bytes: 3309
      reference_path: false
      current_header_fit: true
    boot_profile: wolfboot_mldsa65
    build:
      config_template: configs/wolfboot/stm32l4r5_mldsa65.config
      signing_key: secrets/wolfboot/tuples/mldsa65-development/private_key.der
      signing_tuple:
        tuple_id: mldsa65-development
        directory: secrets/wolfboot/tuples/mldsa65-development
    notes: This profile is build-only for the post-Phase 11 ML-DSA-65 benchmark profile. It uses wolfBoot SIGN=ML_DSA with ML_DSA_LEVEL=3, IMAGE_SIGNATURE_SIZE=3309, and the existing 8192-byte image-header reserve. The framework coordinates the canonical local ML-DSA-65 signing key with the wolfBoot working-tree private key and records SHA-256 key fingerprints as non-secret consistency evidence. Private key material remains local and is not copied into results. A successful build does not prove signing, flashing, UART boot, or hardware success.
  signing:
    id: wolfboot_mldsa65_app
    description: Sign the relocated STM32 HAL application image for the wolfBoot ML-DSA-65 primary slot benchmark profile.
    status: configured_post_phase_11_mldsa_signing_only_not_flashing_or_boot_validated
    boot_profile: wolfboot_mldsa65
    input_image: build/RelocatedDebug/stm32_basic_hal1_mldsa65.bin
    signed_image: build/RelocatedDebug/stm32_basic_hal1_mldsa65_v1_signed.bin
    signature_algorithm: mldsa65
    signature_size_bytes: 3309
    mldsa_benchmark_profile:
      model: configs/benchmarks/classical_signing_profiles.yaml
      profile_id: mldsa65_benchmark
      algorithm: ML-DSA-65
      wolfboot_sign: ML_DSA
      mldsa_level: 3
      security_category: 3
      public_key_size_bytes: 1952
      private_key_size_bytes: 4032
      signature_size_bytes: 3309
      reference_path: false
      current_header_fit: true
    private_key: secrets/wolfboot/tuples/mldsa65-development/private_key.der
    keygen:
      environment:
        ML_DSA_LEVEL: "3"
        IMAGE_SIGNATURE_SIZE: "3309"
      args: --ml_dsa -g {private_key}
    sign:
      environment:
        ML_DSA_LEVEL: "3"
        IMAGE_SIGNATURE_SIZE: "3309"
      args: --ml_dsa {input_image} {private_key} {image_version}
    signing_tuple:
      tuple_id: mldsa65-development
      directory: secrets/wolfboot/tuples/mldsa65-development
    notes: This profile is signing-only for the post-Phase 11 ML-DSA-65 benchmark profile. The private key path is intentionally under secrets/ and must remain local. Build the matching wolfBoot profile first so tools/wolfboot/.config contains ML_DSA_LEVEL=3 and IMAGE_SIGNATURE_SIZE=3309. The matching wolfBoot build profile initializes the complete persistent signing tuple when it is entirely absent; application signing never generates a private key by itself, converts the relocated ELF to the configured BIN image when needed, signs the BIN image with the shared 8192-byte image-header reserve, records signing metadata under results/signing, and retains only the signed image artifact. It does not copy private keys into results, flash hardware, capture UART, or prove secure-boot runtime behaviour.
  experiment:
    id: wolfboot_mldsa65_uart
    description: Flash wolfBoot and the signed ML-DSA-65 application image, then capture UART benchmark evidence.
    boot: wolfboot_mldsa65
    boot_crypto: mldsa65
    firmware:
      mode: wolfboot_mldsa65
      artifact: build/RelocatedDebug/stm32_basic_hal1_mldsa65_v1_signed.bin
    secure_boot_benchmark_profile:
      profile_id: mldsa65_benchmark
      algorithm: ML-DSA-65
      wolfboot_sign: ML_DSA
      signature_algorithm: mldsa65
      mldsa_level: 3
      security_category: 3
      public_key_size_bytes: 1952
      private_key_size_bytes: 4032
      signature_size_bytes: 3309
      status: configured_post_phase_11_mldsa_profile_not_hardware_validated
      signing_profile: configs/algorithms/mldsa65.yaml
      wolfboot_build_profile: configs/algorithms/mldsa65.yaml
      experiment_profile: configs/experiments/secure_boot_uart.yaml
      boot_profile: configs/algorithms/mldsa65.yaml
      mldsa_scope_status: post_phase_11_mldsa_profiles
      mldsa44_status: configured_post_phase_11_mldsa_profile_not_hardware_validated
      mldsa65_status: configured_post_phase_11_mldsa_profile_not_hardware_validated
      mldsa87_status: unsupported_current_8192_byte_header_layout
      mldsa_scope_limitations: ML-DSA-44 and ML-DSA-65 are configured because wolfBoot's ML-DSA examples use the current 8192-byte image-header reserve for those signature sizes. ML-DSA-87 is not configured because the example requires IMAGE_HEADER_SIZE=12288.
    secure_boot_flash:
      evidence_phase: post_phase_11_mldsa_benchmark_profile
      signature_algorithm: mldsa65
      signature_size_bytes: 3309
      wolfboot_offset: 0x08000000
      unsigned_application_artifact: build/RelocatedDebug/stm32_basic_hal1_mldsa65.bin
      signed_application_artifact: build/RelocatedDebug/stm32_basic_hal1_mldsa65_v1_signed.bin
      signed_application_offset: 0x08020000
      signing_private_key: secrets/wolfboot/mldsa65_private_key.der
      boot_timing_source: uart_explicit_verification_time_marker
      notes: This ML-DSA secure-boot benchmark profile uses the same relocated application payload, 8192-byte image-header reserve, UART markers, repeated-run model, static metrics model, runtime memory model, key-consistency evidence, and secure-boot benchmark manifest schema as the classical profiles. Hardware success must only be claimed from user-provided flash and UART logs.
  boot:
    id: wolfboot_mldsa65
    mode: wolfboot_mldsa65
    description: Planned wolfBoot ML-DSA-65 secure-boot profile. Generic direct-flash execution remains blocked; Phase 10h provides an explicit two-artifact flash workflow.
    status: phase_10l_secure_boot_manifest_and_documentation_consolidated
    implementation_state: positive_negative_timing_and_consolidated_manifest_evidence_defined
    intended_signature_algorithm: mldsa65
    mldsa_benchmark_profile:
      model: configs/benchmarks/classical_signing_profiles.yaml
      profile_id: mldsa65_benchmark
      algorithm: ML-DSA-65
      current_header_fit: true
      reference_path: false
    flash_layout_status: defined_phase_10d_used_by_phase_10h_flash_workflow
    secure_boot_layout:
      status: planned_layout_used_by_phase_10h_flash_workflow
      internal_flash_base: 0x08000000
      internal_flash_size: 0x00200000
      internal_flash_end: 0x081FFFFF
      wolfboot_base: 0x08000000
      wolfboot_size: 0x00020000
      primary_slot_base: 0x08020000
      primary_slot_size: 0x000E0000
      primary_slot_entry: 0x08022000
      image_header_size: 0x00002000
      update_slot_base: 0x08100000
      update_slot_size: 0x000E0000
      swap_metadata_base: 0x081E0000
      swap_metadata_size: 0x00020000
      sector_size_assumption: 0x00004000
      physical_flash_page_assumption: 0x00001000
      wolfboot_partition_boot_address: 0x08020000
      wolfboot_partition_size: 0x000E0000
      wolfboot_partition_update_address: 0x08100000
      wolfboot_partition_swap_address: 0x081E0000
    relocated_application_build:
      status: defined_phase_10e_build_only_not_boot_validated
      cmake_configure_preset: RelocatedDebug
      cmake_build_preset: RelocatedDebug
      linker_script: STM32L4R5XX_FLASH_RELOCATED.ld
      vector_table_offset: 0x00022000
      linked_application_start: 0x08022000
      runtime_boot_validated: false
    target_support_assessment:
      status: assessed_phase_10c
      decision_record: docs/decisions/0002_wolfboot_stm32l4_target_support_assessment.md
      upstream_closest_target: stm32l4
      project_target_strategy: project_local_stm32l4r5_target_configuration_or_adaptation
      runnable: false
      notes: Existing upstream STM32L4 wolfBoot support is the closest starting point, but STM32L4R5 / NUCLEO-L4R5ZI-P requires a project-local flash layout and target configuration before wolfBoot build, signing, flashing, or UART evidence can be claimed.
    wolfboot_build_profile:
      status: defined_phase_10f1_project_local_target_adaptation_build_only_not_boot_validated
      profile: configs/algorithms/mldsa65.yaml
      config_template: configs/wolfboot/stm32l4r5_mldsa65.config
      command: python scripts/experiment.py build-wolfboot --boot-algorithm mldsa65
    application_signing_profile:
      status: defined_phase_10g_signing_only_not_flashing_or_boot_validated
      profile: configs/algorithms/mldsa65.yaml
      input_image: build/RelocatedDebug/stm32_basic_hal1_mldsa65.bin
      signed_image: build/RelocatedDebug/stm32_basic_hal1_mldsa65_v1_signed.bin
      private_key: secrets/wolfboot/mldsa65_private_key.der
      command: python scripts/experiment.py sign-application --boot-algorithm mldsa65
    secure_boot_flash_profile:
      status: defined_phase_10l_consolidated_manifest_evidence
      experiment: configs/experiments/secure_boot_uart.yaml
      command: python scripts/experiment.py flash-secure-boot --experiment configs/experiments/secure_boot_uart.yaml --boot-algorithm mldsa65
      wolfboot_offset: 0x08000000
      signed_application_artifact: build/RelocatedDebug/stm32_basic_hal1_mldsa65_v1_signed.bin
      signed_application_offset: 0x08020000
      positive_boot_evidence_status: defined_phase_10i
      negative_corrupted_application_test_status: defined_phase_10j
      boot_timing_status: defined_phase_10k
      manifest_consolidation_status: defined_phase_10l
    notes: Placeholder only. The HAL relocated build profile, wolfBoot build-profile evidence capture, and project-local STM32L4R5 wolfBoot build adaptation exist for local build verification. A local-only application signing workflow exists and can convert the relocated ELF to a BIN before signing. Phase 10i defines a distinct secure-boot application UART marker for positive boot evidence, Phase 10j defines a corrupted-application negative test, Phase 10k records explicit verification timing evidence, and Phase 10l consolidates secure-boot manifest evidence. Hardware success must still only be claimed from user-provided flash and UART logs. This post-Phase 11 ML-DSA boot profile uses the existing secure-boot layout and benchmark evidence model. Hardware success must still only be claimed from user-provided flash and UART logs.
    post_phase_11_mldsa_profile:
      algorithm: ML-DSA-65
      wolfboot_sign: ML_DSA
      signature_algorithm: mldsa65
      mldsa_level: 3
      signature_size_bytes: 3309
      image_header_size_bytes: 8192
      current_header_fit: true
      unsupported_variant_note: ML-DSA-87 is not configured under the current 8192-byte image-header reserve.
